    Data API will provide the APIs to expose the commercial data (i.e. card financial, invoice data) and
    authorization data through RESTful Services. The idea is to create an Enterprise Service with Restful
    architecture, which is robust, secured, scalable and high performance API. Data API provides functionality
    to fetch commercial data and authorization data through following API. 1: Transaction API, 2: Enhanced
    Data API, 3: Starter Data API, 4:Authorization Data (Authorization Data API is an on-demand web service
    which delivers the authorization details (approved/declined) to the end consumer for registered card
