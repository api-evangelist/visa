apis:
- aid: visa:visa-government-insights-hub
  name: Visa Government Insights Hub
  tags:
  - Government
  - Insights
  humanURL: https://developer.visa.com/capabilities/visa-government-insights-hub
  properties:
  - url: https://developer.visa.com/capabilities/visa-government-insights-hub
    name: Visa Government Insights Hub
    type: Documentation
    description: >-
      Visa Government Insights Hub enable tailored, efficient, and agile decision-making with a differentiated
      payments insights solution.
  - url: graphql/visa-graphql.md
    type: GraphQL
  description: >-
    The Visa Government Insights Hub is a platform that provides government agencies with valuable information
    and resources to help them make informed decisions and improve their operations. Through data-driven
    analysis and research, the hub offers insights into consumer spending behavior, trends in payment
    technology, and best practices for implementing digital payments.
- aid: visa:visa-payment-account-reference-inquiry
  name: Visa Payment Account Reference Inquiry
  tags:
  - Payment Account Reference
  - Primary Account Number
  humanURL: https://developer.visa.com/capabilities/visa-par-inquiry
  properties:
  - url: https://developer.visa.com/capabilities/visa-par-inquiry/docs
    name: Visa Payment Account Reference Inquiry
    type: Documentation
  description: >-
    Visa Payment Account Reference Inquiry is a service that allows financial institutions and merchants
    to access useful information about a customer's Visa account. This tool provides real-time data on
    account status, balances, transactions, and more, which enables businesses to efficiently process
    payments and minimize fraud risk. By utilizing Visa Payment Account Reference Inquiry, companies can
    securely verify customer information and ensure smooth, hassle-free transactions.
- aid: visa:visa-pilot-program-enablement
  name: Visa Pilot Program Enablement
  tags:
  - Pilots
  humanURL: https://developer.visa.com/capabilities/vdp-pilot-program
  properties:
  - url: https://developer.visa.com/capabilities/vdp-pilot-program/docs-getting-started
    name: Getting Started
    type: Documentation
  description: >-
    Visa Pilot Program Enablement is a service that allows businesses to easily launch and manage pilot
    programs for new Visa products or services. This includes providing support and resources for program
    strategy, implementation, and evaluation. By utilizing Visa Pilot Program Enablement, businesses can
    quickly and efficiently test out new ideas and innovations in a controlled environment before fully
    committing to a widespread rollout.
- aid: visa:visa-underwriting-intelligence-solutions
  name: Visa Underwriting Intelligence Solutions
  tags:
  - Intelligence
  - Underwriting
  humanURL: https://developer.visa.com/capabilities/visa-underwriting-intelligence-solutions
  properties:
  - url: https://developer.visa.com/capabilities/visa-underwriting-intelligence-solutions/docs
    name: Visa Underwriting Intelligence Solutions
    type: Documentation
  description: >-
    Visa Underwriting Intelligence Solutions is a leading provider of data analytics and risk management
    solutions for financial institutions. With a focus on using advanced technology and algorithms to
    assess creditworthiness and streamline the underwriting process, Visa Underwriting Intelligence Solutions
    helps lenders make more informed decisions quickly and efficiently.
- aid: visa:vca-data-exchange
  name: VCA Data Exchange
  tags:
  - Data
  - Insights
  humanURL: https://developer.visa.com/capabilities/vca-data-exchange
  properties:
  - url: https://developer.visa.com/capabilities/vca-data-exchange/docs
    name: VCA Data Exchange
    type: Documentation
  description: >-
    VCA Data Exchange is a platform that allows businesses to securely exchange data with their partners,
    customers, and suppliers. Whether it's sharing customer information, product catalogs, or financial
    data, VCA Data Exchange provides a streamlined solution for securely transferring and managing data.
    By centralizing data exchange processes, VCA Data Exchange helps organizations improve efficiency,
    reduce errors, and enhance collaboration with external stakeholders.
- aid: visa:visa-practical-money-skills-financial-education-platform
  name: Visa Practical Money Skills Financial Education Platform
  tags: []
  humanURL: https://developer.visa.com/capabilities/practical-money-skills
  properties:
  - url: https://developer.visa.com/capabilities/practical-money-skills/docs-getting-started
    name: Getting Started with Visa Practical Money Skills
    type: GettingStarted
  - url: https://developer.visa.com/capabilities/practical-money-skills/docs-authentication
    name: Authentication Method for Visa Practical Money Skills
    type: Authentication
  - url: https://developer.visa.com/capabilities/practical-money-skills/product-terms
    name: Visa Practical Money Skills Terms
    type: TermsOfService
  description: >-
    Visa Practical Money Skills Financial Education Platform is an online resource that provides valuable
    tools and information to help individuals improve their financial knowledge and skills. The platform
    offers a wide range of resources, including articles, videos, calculators, and games, to help users
    learn about budgeting, credit management, savings, investing, and more.
- aid: visa:visa-resolve-online
  name: Visa Resolve Online
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-resolve-online
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/visa-resolve-online
  description: >-
    Visa Resolve Online is a platform developed by Visa that enables financial institutions and merchants
    to streamline the process of resolving disputed transactions. It provides a centralized system for
    submitting and managing disputes, allowing for efficient communication and collaboration between all
    parties involved. With Visa Resolve Online, users can track the status of disputes in real-time, access
    relevant documentation and evidence, and ultimately reach a timely resolution.
- aid: visa:visa-europe-payment-stop-service
  name: Visa Europe Payment Stop Service
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-stop-payment-service
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/visa-stop-payment-service/docs-getting-started
  description: >-
    Visa Europe Payment Stop Service is a feature offered by Visa that allows cardholders to temporarily
    suspend or cancel any recurring or future payments set up with their Visa card. This can be helpful
    in cases where cardholders have lost their card, suspect fraudulent activity, or simply want to pause
    payments for a period of time.
- aid: visa:visa-subscription-manager
  name: Visa Subscription Manager
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-subscription-manager
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/visa-subscription-manager
  description: >-
    Visa Subscription Manager is a service that allows consumers to easily manage and control their recurring
    payments and subscriptions. With this platform, users can view all of their recurring charges in one
    place, set reminders for upcoming payments, and easily cancel or change subscriptions as needed. This
    tool provides consumers with greater transparency and control over their spending, helping them to
    better manage their finances and avoid unexpected charges.
- aid: visa:order-insight-digital
  name: Order Insight Digital
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-cardholder-purchase-inquiry
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/visa-cardholder-purchase-inquiry
  description: >-
    When cardholders are reviewing their card statement, confusion over if a purchase is legitimate is
    one of the most common occurrances. A cardholders first reaction when this occurs is typically to
    pick up the phone to contact the issuing bank, tying up valuable issuer resources in an attempt to
    identify this purchase and/or pursue a dispute.
- aid: visa:visa-dcvv2-generate
  name: Visa dCVV2 Generate
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-dcvv2-generate
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/visa-dcvv2-generate/docs-getting-started
  description: >-
    Visa dCVV2 Generate is a tool designed to help businesses generate dynamic card verification values
    (dCVV2) for online transactions. This security feature adds an extra layer of protection by providing
    a unique code that is only valid for a short period of time, making it more difficult for fraudsters
    to use stolen card information for unauthorized purchases.
- aid: visa:visa-risk-manager
  name: Visa Risk Manager
  tags: []
  humanURL: https://developer.visa.com/capabilities/vrm
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/vrm
  description: >-
    Visa Risk Manager is a web portal that provides a comprehensive suite of fraud and risk management
    tools that can be accessed through Visa Online 24/7. It is specifically designed to help issuers optimize
    fraud loss prevention and maximize profitability by providing clients with an effective transaction
    risk management decisioning system.
- aid: visa:visa-token-service
  name: Visa Token Service
  tags: []
  humanURL: https://developer.visa.com/capabilities/vts
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/vts/docs
  description: >-
    Visa Token Service is a technology solution that aims to enhance the security and convenience of digital
    payments. It replaces sensitive card information with a unique digital identifier, called a token,
    which is used for payment transactions. This ensures that actual card details are not shared during
    the transaction process, reducing the risk of fraud and unauthorized access to payment information.
- aid: visa:visa-token-service-provisioning-and-credential-management
  name: Visa Token Service Provisioning and Credential Management
  tags: []
  humanURL: https://developer.visa.com/capabilities/token-service-provisioning
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/token-service-provisioning
  description: >-
    Visa Token Service Provisioning and Credential Management is a secure platform that allows consumers
    to make purchases using a tokenized payment method, which replaces sensitive payment information with
    a unique token. This platform provisions tokens to mobile devices, wearables, and other connected
    devices, enabling consumers to make fast and secure payments without exposing their actual payment
    card details.
- aid: >-
    visa:visa-b2b-connect-is-built-on-visa-s-capabilities-and-formidable-core-payments-experience-with-distributed-ledger-technology-to-provide-direct-settlements-of-large-value-transactions-visa-b2b-connect-can-help-financial-institutions-and-their-clients-overcome-costly-processes-and-geographic-barriers-which-translates-to-an-improved-seamless-end-to-end-experience-
  name: >-
    Visa B2B Connect is built on Visa's capabilities and formidable core payments experience with distributed
    ledger technology to provide direct settlements of large-value transactions. Visa B2B Connect can
    help financial institutions and their clients overcome costly processes and geographic barriers, which
    translates to an improved, seamless end-to-end experience.
  tags: []
  humanURL: https://developer.visa.com/capabilities/vces
  properties: []
  description: >-
    Visa Card Eligibility Service (VCES) is an account eligibility verification product enabling our issuers,
    merchants, partners, and developers to check eligibility/access rights to exclusive benefits, offers,
    and promotions, subject to terms and restrictions, in real-time.
- aid: visa:visa-offers-platform
  name: Visa Offers Platform
  tags: []
  humanURL: https://developer.visa.com/capabilities/vop
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/vop
  description: "Visa\x19s Customers can get access to near real-time transaction data via the Visa Offers\
    \ Platform to execute and manage their card-linked programs. For cardholders who have consented to\
    \ take part in the Customer\x19s program, VOP can access the VisaNet authorization and settlement\
    \ stream to qualify transactions and send the relevant notifications to the Customer in near real-time.\
    \ Using the VOP APIs, Customers can leverage capabilities to enhance their own web and mobile applications."
- aid: visa:installment-transaction-service
  name: Installment Transaction Service
  tags: []
  humanURL: https://developer.visa.com/capabilities/installment-transaction-service
  properties:
  - type: Documentation
    url: https://developer.visa.com/capabilities/installment-transaction-service/docs
  description: >-
    The Installments Transaction Service allows you to offer Buy Now Pay Later (BNPL) plans to your customers
    through a set of APIs or on ISO. The plans can be offered pre-purchase, during, or post-purchase and
    give consumers the opportunity to pay for qualifying purchases over time. For you, it means attracting
    and retaining a larger customer base with a seamless user experience that is scalable and cost effective.
- aid: visa:kernel-in-the-cloud
  name: Kernel in the Cloud
  tags: []
  humanURL: https://developer.visa.com/capabilities/kernel-in-the-cloud
  properties: []
  description: >-
    Kernel in the Cloud is pioneering innovation via a software-based cloud infrastructure to democratize
    acceptance. It provides a secure, modular and service architecture-oriented solution to enable acceptance.
    This solution eliminates traditional hardware constraints and enables faster and easier deployment
    of value-added services at the point-of-sale.
- aid: visa:visa-direct-request-to-pay
  name: Visa Direct Request to Pay
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-direct-request-to-pay
  properties: []
  description: >-
    Send and receive payment requests with Visa Direct request to payInnovate and simplify services for
    you and your clients with our secure, fast and convenient messaging framework.
- aid: visa:visa-mobile
  name: Visa Mobile
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-mobile
  properties: []
  description: >-
    Product integrates with a new e-commerce payment methodVisa Mobile is the new UX for cards e-commerce
    payments, that is mobile, quicker yet safe - builds on SRC and regular CNP transactions rails.
- aid: visa:receiver-directed-payouts
  name: Receiver Directed Payouts
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-receiver-directed-payouts
  properties: []
  description: >-
    Securely capture, validate, verify and store a receivers payment credentials within the Alias Directory
    Service, without the burden of being PCI compliant.
- aid: visa:visa-direct-account-and-wallet
  name: Visa Direct Account and Wallet
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-direct-account-and-wallet
  properties: []
  description: >-
    Visa Direct Account and Wallet is built to help businesses deliver money to billions of endpoints
    worldwide through ACH, and faster payment networks1 via a single integration. Support your clients
    with a payment solution that can help meet their operational, commercial, and regulatory needs.
- aid: visa:visa-direct-connect
  name: Visa Direct Connect
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-direct-connect
  properties: []
  description: >-
    Visa Direct Connect reduces the effort to integrate with money movement methods, routes and endpoints
    supported by Visa Direct.
- aid: visa:visa-chip-l3-testing-report-upload
  name: Visa Chip L3 Testing Report Upload
  tags: []
  humanURL: https://developer.visa.com/capabilities/l3-chip-compliance
  properties: []
  description: Streamline L3 testing through the use of these APIs.
- aid: visa:visa-travel-notification
  name: Visa Travel Notification
  tags: []
  humanURL: https://developer.visa.com/capabilities/tns
  properties: []
  description: >-
    Visa Travel Notification Service helps you avoid mistaken purchase declines while your cardholders
    are traveling by incorporating cardholder self-reported travel plans into the VisaNet authorization
    message. With Visa Travel Notification Service, Visa informs you whether your cardholder is transacting
    during the travel dates and at the travel destination they reported, helping you more confidently
    approve transactions when your cardholders make purchases while travelling.
- aid: visa:dps-card-and-account
  name: DPS Card and Account
  tags: []
  humanURL: https://developer.visa.com/capabilities/dps-card-and-account-services
  properties: []
  description: >-
    Enable issuers to manage their cardholders card and account informationDPS Card and Account Services
    supports a set of debit, credit, and prepaid card and account services. The_DPS Card and Account Services
    APIs can be used by any developer in the sandbox._.
- aid: visa:dps-digital-services
  name: DPS Digital Services
  tags: []
  humanURL: https://developer.visa.com/capabilities/dps-digital-services
  properties: []
  description: >-
    DPS Digital Services partners with third-party service providers, integrating with their unique offerings
    to provide comprehensive business solutions and richer service offerings for issuers.
- aid: visa:dps-forward
  name: DPS Forward
  tags: []
  humanURL: https://developer.visa.com/capabilities/dps-forward-services
  properties: []
  description: >-
    The best of Visa DPS issuer processing capabilities are accessible through a suite of APIs designed
    for digital banking platforms. Use DPS Forward to create powerful card products and digital payment
    solutions._.
- aid: visa:visa-tokenized-asset-platform-vtap-
  name: Visa Tokenized Asset Platform (VTAP)
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-tokenized-asset-platform
  properties: []
  description: >-
    VTAP provides the tools and infrastructure for banks to tokenize fiat currencies on blockchain networks.
    Clients can access and test VTAP capabilities through an API layer that connects to blockchain infrastructure
    and utilizes a Visa-developed standard for issuing fiat-backed tokens. Clients can access VTAP in
    a nonvalue Sandbox testing phase that can be used for different tokenization use cases._.
- aid: visa:visa-b2b-payment-controls
  name: Visa B2B Payment Controls
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-b2b-payment-controls
  properties: []
  description: >-
    Visa B2B Payment Controls offers authorization-based payment controls solutions for B2B market segments
    such as Government, Corporate, Commercial and Small Business. This service allows more security and
    safety for commercial payments and provides issuers and their third-party providers with spend protection
    mechanisms.
- aid: visa:visa-flexible-credential-vfc-
  name: Visa Flexible Credential (VFC)
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-flexible-credential
  properties: []
  description: >-
    Visa Flexible Credential (VFC) enables Issuers and Fintechs to broaden the services they can provide
    to new and existing cardholders by enabling easy access to multiple funding sources through a single
    Visa credential.
- aid: visa:visa-alias-directory
  name: Visa Alias Directory
  tags: []
  humanURL: https://developer.visa.com/capabilities/alias-directory-service
  properties: []
  description: >-
    Visa Alias Directory Service is built to help simplify payments, improve the user experience, and
    protect sensitive payment credential information by using Aliases._Alias Directory offers capabilities
    for clients to link Aliases, such as mobile numbers or email addresses, to payment credentials such
    as cards or bank accounts. Clients can manage the lifecycle of an Alias and resolve an Alias to receive
    the associated payment credential.
- aid: visa:visa-installment-management
  name: Visa Installment Management
  tags: []
  humanURL: https://developer.visa.com/capabilities/installment-management-service
  properties: []
  description: >-
    The Installment Management Service allows you to provide installment offers to all participating merchants
    at point-of-sale, online or in-store, giving your cardholders access to a new payment method._.
- aid: visa:visa-faster-payments-gateway
  name: Visa Faster Payments Gateway
  tags: []
  humanURL: https://developer.visa.com/capabilities/visa-faster-payments-gateway
  properties: []
  description: >-
    Visa Faster Payments Gateway_supports both send and receive capabilities for credit transfers and
    request for return of funds. We set up the digital infrastructure - your participating account holders
    send and receive payments any time of day, every day, including holidays and weekends.
- aid: visa:visanet-connect
  name: VisaNet Connect
  tags: []
  humanURL: https://developer.visa.com/capabilities/visanet-connect-acceptance
  properties: []
  description: >-
    VisaNet Connect APIs enable Visa clients -- such as acquirers, acquirer-processors, and approved technology
    partners -- to process in-store, in-app, and online payments through a direct interface to Visas global
    payment system. Clients can quickly and securely process these and other payments solutions over a
    simple internet connection to VisaNet, eliminating the need for installing hardware at the clients
    site._.
- aid: visa:visanet-connect-issuing
  name: VisaNet Connect - Issuing
  tags: []
  humanURL: https://developer.visa.com/capabilities/visanet-connect-issuing
  properties: []
  description: >-
    VisaNet Connect  Issuing APIs are a portfolio of VisaNet Connect APIs that provide direct connectivity
    to VisaNet for issuers to approve and decline payments requested by their cardholders or process clearing
    requests submitted by acquirers. The VisaNet Connect  Issuing APIs support a broad range of payment
    types, including point-of-sale, ecommerce, digital wallets, and ATMs. Connectivity to VisaNet is provided
    via a lightweight, easy-to-integrate set of RESTful APIs.
- aid: visa:visa-account-management-service-api
  name: Visa Account Management service API
  description: >-
    The Account Management web services are used to manage payment controls for existing card accounts
    and to request virtual accounts while setting controls. The endpoints allow the user to retrieve the
    status of new account requests, view authorization rules, submit virtual card requisitions for an
    employee , and retrieve security code (CVV2) details of an existing account.
