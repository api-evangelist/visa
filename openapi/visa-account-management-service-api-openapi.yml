                    rules:
                    - ruleCode: ADT
                    - ruleCode: AIR
                    - ruleCode: ATM
                    - ruleCode: ATML
                      overrides:
                      - sequence: '0'
                        overrideCode: amountValue
                        parentOverrideCode: amountOverride
                        overrideValue: '1'
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        parentOverrideCode: amountOverride
                        overrideValue: '840'
                    - ruleCode: AUTO
                    - ruleCode: BUS
                      overrides:
                      - sequence: '0'
                        overrideCode: timezone
                        overrideValue: Alaskan Standard Time
                      - sequence: '0'
                        overrideCode: weekDayEffective
                        parentOverrideCode: timeRange
                        overrideValue: SUN
                      - sequence: '0'
                        overrideCode: timeEffectiveStart
                        parentOverrideCode: timeRange
                        overrideValue: 01:00
                      - sequence: '0'
                        overrideCode: timeEffectiveEnd
                        parentOverrideCode: timeRange
                        overrideValue: '15:00'
                    - ruleCode: CAID
                      overrides:
                      - sequence: '0'
                        overrideCode: CAIDValue
                        parentOverrideCode: CAIDOverride
                        overrideValue: '847833'
                    - ruleCode: CLOTH
                    - ruleCode: ECOM
                    - ruleCode: FUEL
                    - ruleCode: GTM
                    - ruleCode: HOT
                    - ruleCode: NOTFUEL
                    - ruleCode: VPAS
                      overrides:
                      - sequence: '0'
                        overrideCode: amountValue
