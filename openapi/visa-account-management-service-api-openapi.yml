                    - ruleCode: OSS
                    - ruleCode: GROC
                    - ruleCode: ENT
                    - ruleCode: UTIL
                    - ruleCode: CLOTH
                    - ruleCode: MED
                    - ruleCode: VPAS
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: amountValue
                        overrideValue: '55.45'
                    startDate: '2018-05-11'
                  proxyPoolId: Proxy12345
                  optionalInfo:
                  - optionalFieldValue: '12345678901234567'
