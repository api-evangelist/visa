  /vpa/v1/requisitionService:
    post:
      tags:
      - Account Management service
      summary: Request Virtual Account
      description: Requisition API Request and Response
      operationId: Request Virtual Account
      requestBody:
        description: Requisition Request
        content:
          application/json:
            schema:
              required:
              - action
              - buyerID
              - clientID
              - messageID
              type: object
              properties:
                action:
                  maxLength: 1
                  type: string
                  description: 'Indicates the requisition action to be performed. Valid choices are: <br> "A" for Add: Initiates a new virtual account requisition. <br> "U" for Update: Modifies an existing virtual account requisition. Ensure that all requisition details and optional fields are included in the request since these will replace previous settings. <br> "D" for Delete: Deletes a requisition. This sets the validity end date to the current date, leading to requisition expiration and the one-cent rule being applied to the account.'
                buyerID:
                  maxLength: 25
                  type: string
                  description: Unique numeric identifier for the buyer that's defined by the Issuer.
                clientID:
                  maxLength: 25
                  type: string
                  description: Unique identifier for the financial institution, provided by Visa during setup.
                messageID:
                  maxLength: 36
                  type: string
                  description: Unique identifier for the request, generated by the API consumer, for tracking and referencing purposes. Each request mandates a unique messageId.
                proxyPoolID:
                  maxLength: 19
                  type: string
                  description: 'Unique identifier for the single-use proxy pool from which the account should be selected. For a new requisition (action: "A"), the system picks an available account from this pool, applies all requisition parameters (i.e. validity period, authorization rules), and provides the account number in the response. If only one Proxy Pool exists for the buyer, this field is optional as the system will default to the existing pool. <br><br> Required for action: "A", if the buyer has more than one single-use proxy pool.'
                OptionalInfo:
                  type: array
                  description: 'This complex element enables API consumers to send optional name-value pairs, which will appear in the transaction data for the requisitioned account. A maximum of 50 optional feild name and values can be passed in the request. <br><br> This complex element contains: optionalFieldName, optionalFieldValue'
                  items:
                    type: object
                    properties:
                      optionalFieldName:
                        maxLength: 50
                        type: string
                        description: Name of the Optional Field
                      optionalFieldValue:
                        maxLength: 100
                        type: string
                        description: Value of the Optional Field
                accountNumber:
                  maxLength: 16
                  type: string
                  description: 'The account number associated with the virtual account requisition being updated or deleted. This number was returned with the initial requisition add request (action A).<br><br> Required if action: "U" or "D"'
                numberOfCards:
                  maxLength: 4
                  type: string
                  description: 'Indicates the number of virtual accounts being requested. <br><br> If a single card is requested, an available account is selected from the proxy pool specified in the proxyPoolID parameter. Payment controls will subsequently be applied to the account, taking effect from the specified requistion start date and ceasing on the requisition end date. The API response will return the account number and expiration date. <br><br> If multiple cards are requested, a file is created detailing each account number and expiration date and delivered via SFTP (these details won''t be returned in the API). All accounts will have identical rules and configurations. To use this bulk request feature, please contact your Visa representative. <br><br> Required if action: "A"'
                requisitionDetails:
                  type: object
                  properties:
                    rules:
                      type: array
                      description: 'Complex elements which contain all the authorization rules to be set on the requested account. Contains: ruleCode, overrides. It''s best practice to maintain at least one spend control on an account. For pseudo accounts and TSYS VANs, a minimum of one rule is required.'
                      items:
                        type: object
                        properties:
                          ruleCode:
                            maxLength: 8
                            type: string
                            description: 'Denotes the unique code for the authorization rule. For example, "VPAS" is the ruleCode for the exact amount authorization rule. <br><br> Refer to the <a href=''/pages/B2B-virtual-account-payment-method-codes#rules_and_overrides_for_request_virtual_account_and_manage_payment_controls''>VPC Rules and Overrides table</a> for the complete list of valid Visa Payment Controls (VPC) rules and specifications. <br><br> For buyers using TSYS VANs, please refer to the <a href=''/pages/B2B-virtual-account-payment-method-codes#rules_and_overrides_for_request_virtual_account__for_tsys_vpp''>VPP Rules and Overrides table</a>. <br> <br> Required if action: "A" or "U"'
                          overrides:
                            type: array
                            description: 'Overrides are supplementary request parameters that provide additional context to the primary "ruleCode" parameter. These may be required or optional, depending on the rule. This complex element contains: sequence, overrideCode, and overrideValue. <br><br> For example, to set a $1000 aurthorization limit on a requested account, you would include an "amountValue" override of "1000" and an "amountCurrencyCode" override of "USD" with "ruleCode": "PUR"'
                            items:
                              type: object
                              properties:
                                sequence:
                                  maxLength: 3
                                  type: string
                                  description: Contains the sequence number for the override. Each rule starts with 0 so if you have an SPV and BUS, then SPV will have sequence 0 and BUS will have a 0. If there are multiple fields/ overrides within a rule, e.g. SPV.  Each override - amount, currency code, range type, etc.-  have the same sequence number. E.g. amount, currency code and range type will all have 0.  If there is a rule that can have multiple amounts e.g. Exact match, then each VPAS rule overrides must have a unique sequence number so first VPAS has 0, then second has 1, third has 2.
                                overrideCode:
                                  maxLength: 50
                                  type: string
                                  description: The code for the authorization rule override. <br><br> Required for actions "A" and "U" if the corresponding ruleCode mandates overrideCode values. Please refer to the <a href="https://developer.visa.com/pages/B2B-virtual-account-payment-method-error-codes#request_virtual_account">Rules and Overrides table</a> as not all ruleCodes necessitate an overrideCode. For instance, ruleCode "SPV" requires overrideCode "rangeType" and "updateFlag", while ruleCode "AUTO" has no applicable overrides.
                                overrideValue:
                                  maxLength: 100
                                  type: string
                                  description: 'The value for the authorization rule override. <br><br> Required for action: "A" and "U" for each respective overrideCode that''s included in the request.'
                    endDate:
                      maxLength: 10
                      type: string
                      description: 'The validity end date for the requisitioned account, formatted as YYYY-MM-DD or MM/DD/YYYY. Upon reaching the end date, the system revokes all existing authorization rules, and applies the 1-cent rule, effectively rendering the account unusable. For example, an endDate of 2022-10-31 results in the 1-cent rule being applied at 12:00:01 on 2022-11-01. This date must not exceed the funding account''s expiration date. <br><br> Note for Buyers using TSYS VANs: startDate and endDate must be sent in Eastern time zone. <br><br> Note for Buyers using a legacy model with processor PANs: In the absence of a requisition ''endDate'', the account''s authorization rules will remain effective until the expiration of the associated card. <br><br> Required if action: "A" or "U"'
                    timeZone:
                      maxLength: 12
                      type: string
                      description: 'Denotes the time zone for the requisition''s startDate and endDate. The system, in respect to the chosen time zone, activates the authorization rules from 0:00 a.m. on the startDate until 0:00 a.m. on the day following the endDate (i.e. endDate +1) <br><br> Time zones should adhere to the UTC offset format. For example,"UTC-08:00" for PST, "UTC-06:00" for CST, "UTC+05:30" for IST, etc. <br><br> Note for Buyers using TSYS VANs: startDate and endDate must be sent in Eastern time zone. <br><br> Required if action: "A" or "U"'
                    startDate:
                      maxLength: 10
                      type: string
                      description: 'Denotes the start date of account validity. Dates should adhere to either the YYYY-MM-DD or MM/DD/YYYY format and can be set up to three years in the future. On the specified start date, the authorization rules defined in the request will be implemented on the account. Until this date arrives, the system assigns a preliminary 1 cent exact match authorization rule to the account. In the absence of this field value, the card will be activated instantly, and the authorization rules from the requisition are applied immediately. <br><br> Note for Buyers using TSYS VANs: startDate and endDate must be sent in Eastern time zone. <br> <br> Please note, once the card is activated, it''s not possible to reset the startDate to a future date.'
                    mcgRuleAction:
                      maxLength: 5
                      type: string
                      description: 'Defines the action for Merchant Category Group (MCG) based rules applied to the requested card(s). Accepts "Allow" or "Block", defaulting to "Block" if not provided. This field only supports Visa Payment Controls (VPC) enabled buyers and is ignored for buyers using TSYS VANs. <br><br> Example: the value "Allow" with MCG rule code "AIR" authorizes transactions from Airline MCC''s. Conversely, "Block" with the same code prevents transactions from Airline MCC''s. <br><br> Please note, the mcgRuleAction value is not applicable to following MCG rules: MCCB, MCCX, CAID, CAIDB, NOTFUEL.'
                  description: This complex element contains the requisition details.
            examples:
              Default:
                summary: Default
                value:
                  clientId: B2BWS_1_1_9999
                  requisitionDetails:
                    endDate: '2018-05-20'
                    timeZone: UTC-8
                    rules:
                    - ruleCode: SPV
                      overrides:
                      - sequence: '1'
                        overrideCode: spendLimitAmount
                        overrideValue: '55.45'
                      - sequence: '2'
                        overrideCode: maxAuth
                        overrideValue: '10'
                      - sequence: '3'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '4'
                        overrideCode: rangeType
                        overrideValue: '3'
                      - sequence: '5'
                        overrideCode: startDate
                        overrideValue: 05/11/2018
                      - sequence: '5'
                        overrideCode: endDate
                        overrideValue: 05/20/2018
                      - sequence: '7'
                        overrideCode: updateFlag
                        overrideValue: NOCHANGE
                    - ruleCode: PUR
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: amountValue
                        overrideValue: '55'
                    - ruleCode: EAM
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: amountValue
                        overrideValue: '55'
                    - ruleCode: XBRA
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: amountValue
                        overrideValue: '55'
                    - ruleCode: ATML
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: amountValue
                        overrideValue: '55'
                    - ruleCode: TOLRNC
                      overrides:
                      - sequence: '0'
                        overrideCode: amountCurrencyCode
                        overrideValue: '840'
                      - sequence: '0'
                        overrideCode: minValue
                        overrideValue: '1'
                      - sequence: '0'
                        overrideCode: maxValue
                        overrideValue: '50'
                    - ruleCode: CAID
                      overrides:
                      - sequence: '0'
                        overrideCode: CAIDValue
                        overrideValue: '123456'
                    - ruleCode: ATM
                    - ruleCode: ECOM
                    - ruleCode: CNP
                    - ruleCode: NOC
                    - ruleCode: ADT
