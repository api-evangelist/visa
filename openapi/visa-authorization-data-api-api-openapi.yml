          type: string
        uniqSeqId:
          type: string
        authCatgCd:
          type: string
        authIdResp:
          type: string
        crdAcptrId:
          type: string
        isoTranAmt:
          type: string
        mrchCatgCd:
          type: string
        mrchCtryCd:
          type: string
        stipAdvcCd:
          type: string
        tranProcCd:
          type: string
        authRsnDesc:
          type: string
        crdhBillAmt:
          type: string
        msgTypeDesc:
          type: string
        tokenNumber:
          type: string
        trgrSvcDesc:
          type: string
        trgrSvcType:
          type: string
        vpcActTknCd:
          type: string
        authCatgDesc:
          type: string
        isoTranCurrCd:
          type: string
        vpcPropActnCd:
          type: string
        authStatusCode:
          type: string
        crdhBillAmtUsd:
          type: string
        crdhBillCurrCd:
          type: string
        mrchStatePrvCd:
          type: string
        partialAuthAmt:
          type: string
        stipSwtchRsnCd:
          type: string
        tokenIndicator:
          type: string
        stipSwtchRsnDesc:
          type: string
    MetaData:
      title: MetaData
      type: object
      properties:
        pageNum:
          type: integer
          format: int32
        totalMatchedRecords:
          type: integer
          format: int32
    ApiError:
      title: ApiError
      type: object
      properties:
        message:
          type: string
