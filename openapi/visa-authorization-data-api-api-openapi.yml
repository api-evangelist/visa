components:
  schemas:
    AuthResponseBody:
      title: AuthResponseBody
      type: object
      properties:
        metaData:
          $ref: '#/components/schemas/MetaData'
        authTransactions:
          type: array
          items:
            $ref: '#/components/schemas/AuthTransactionFormat'
    AuthRequestFilters:
      title: AuthRequestFilters
      type: object
      properties:
        filterBy:
          type: string
          description: filter by clause. Supported values are authCatgCd and msgType
        filterValues:
          type: array
          items:
            type: string
      description: A List of optional filters
    ApiErrors:
      title: ApiErrors
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'
    AuthRequestBody:
      title: AuthRequestBody
      required:
      - authEndDateTime
      - authStartDateTime
      - companyId
      - issuerId
      - processorId
      - regionId
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AuthRequestFilters'
        pageNum:
          maximum: 250
          minimum: 20
          type: integer
          description: page Number associated with API call.
          format: int32
        issuerId:
          maxLength: 15
          minLength: 1
          pattern: ^[0-9]+$
          type: string
          description: issuerId/bankId associated with the account
        pageSize:
          type: integer
          description: page Size associated with API call.
          format: int32
        regionId:
          maxLength: 5
          minLength: 1
          pattern: ^[0-9]+$
          type: string
          description: regionId associated with the account
        companyId:
          maxLength: 25
          minLength: 1
          pattern: ^[0-9]+$
          type: string
          description: companyId associated with the account
        accountList:
          type: array
          description: A list of account numbers
          items:
            type: string
        processorId:
          maxLength: 10
          minLength: 1
          pattern: ^[0-9]+$
          type: string
          description: processorId associated with the account
        authEndDateTime:
          type: string
          description: Transaction Auth time in GMT. Sample value --> 2022-09-01T01:40:00
          format: date-time
        authStartDateTime:
          type: string
          description: Transaction Auth time in GMT. Sample value --> 2022-09-01T01:40:00
          format: date-time
      description: Authorization Pull API Request format
    AuthTransactionFormat:
      title: AuthTransactionFormat
      type: object
      properties:
        authDt:
          type: string
        issuer:
          type: string
        mrchNm:
          type: string
        region:
          type: string
        tranId:
          type: string
        acctNum:
          type: string
        company:
          type: string
        msgType:
          type: string
        preAuth:
          type: string
