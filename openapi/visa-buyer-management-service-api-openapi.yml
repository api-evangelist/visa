          type: string
          description: Denotes the Account Holder Last Name which will be used while processing the STP payment. If the value for this field (the tag is not sent) is not provided, system defaults to the buyer primary contact person's name (The value from the first space character until the end of the field will be used as the last name).
        accountHolderFirstName:
          maxLength: 100
          type: string
          description: Denotes the Account Holder First Name which will be used while processing the STP payment. If the value for this field (the tag is not sent) is not provided, system defaults to the buyer primary contact person's name (The value upto the first space character will be used as the first name)
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the STP Payment Remittance notification is enabled for a buyer.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'. Valid values are 'True' or 'False'. This field can be set to true only if the bank STP Payment Remittance Notification option is set to 'True'. The STP supplier will be getting the payment remittance notification only if this field is enabled.
    ErrorItem:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
      description: Error Item
    GetBuyerTemplateResponseV2:
      type: object
      properties:
        vanConfig:
          $ref: '#/components/schemas/GetVanConfig'
        templateId:
          maxLength: 30
          type: string
          description: Unique Identifier for a Template. It should be alphanumeric.  Should be an existing template id associated with the bank (associated to the client id).  The template id is returned in the response of the GetTemplate API.
        contactInfo:
          $ref: '#/components/schemas/GetContactInfo'
        proxyConfig:
          $ref: '#/components/schemas/GetProxyConfig'
        templateName:
          maxLength: 50
