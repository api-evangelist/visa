components:
  schemas:
    PaymentFileCommConfig:
      type: object
      properties:
        edi824FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 824 outbound response file
        edi997FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 997 outbound ack file
        inboundFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm file ID associated with the EDI 820 inbound payment file
      description: PaymentFileCommConfig contains the comm file configuration for inbound EDI 820, and outbound EDI 997 and EDI 824.
    CreateBuyerTemplateSuccessResponse:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/CreateBuyerTemplateResponse'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Create Buyer Template Success Response
    GetVanConfig:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.
        vanEnabled:
          type: boolean
          description: Denotes if "VANs" (VPP Tokens) are enabled for the template (buyers).
    GetBuyerSuccessResponseV2-3:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/GetBuyerResponseV2-3'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Response for a successful fetch of a Buyer
    VanConfigForCreate:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.  This value will be provided by the Visa implementation team. If the value for this field (the tag is not sent) is not provided, the system defaults it to the bank FCS ID if there is only one setup at the bank level. Supports alphanumeric values. Required if the buyer is enabled for VANs.
        vanEnabled:
          type: boolean
          description: Denotes if "VANs" (VPP Tokens) are enabled for the buyer. Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.
        admClientId:
          maxLength: 4
          type: string
          description: Denotes the number the TSYS VPP system uses to identify the company on the ACE Decision Max system for account assignment. This value will be provided by the Visa implementation team.
        mcADMOptionId:
          maxLength: 5
          type: string
          description: Denotes the option that will be used to assign the virtual account number in the TSYS VPP platform. For the TS1 platform only, the option must be set up to assign a virtual account number from the same BIN as the primary account number. This value will be provided by the Visa implementation team.  If it is a Mastercard  bank, then this field is required.
        processingType:
          maxLength: 4
          type: string
          description: Denotes the Processing type for the virtual account number (VAN). This value will be provided by the Visa implementation team.
        visaADMOptionId:
          maxLength: 5
          type: string
          description: Denotes the option that will be used to assign the virtual account number in the TSYS VPP platform. For the TS1 platform only, the option must be set up to assign a virtual account number from the same BIN as the primary account number. If it is a Visa bank, then this field is required. This value will be provided by the Visa implementation team.
    GetPaymentSecurityConfig:
      type: object
      properties:
        customSecurityQuestions:
          maxItems: 3
          uniqueItems: true
          type: array
          description: The questions (text) which will be used at random (Only one of the questions will be displayed) to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. The system sends the security questions and answers to the supplier when the supplier is setup for the buyer.  At least one question needs to be sent if custom security question is enabled for the template.
          items:
            maxLength: 100
            type: string
            description: Upto 3 custom security questions could be used.
        defaultSecurityQuestion:
          maxLength: 256
          type: string
          description: Denotes the text for the default security question which will be displayed to the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.
        defaultSecurityFieldCode:
          maxLength: 1
          pattern: ^[\d]+$
          type: string
          description: Denotes the field system uses to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.
        customSecurityQuestionsEnabled:
          type: boolean
          description: Denotes if the buyer wants to use custom security questions to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.
    BoostPaymentConfigForUpdate:
      type: object
      properties:
        boostPaymentEnabled:
          type: boolean
          description: Denotes if Boost payments is enabled for the buyer.  Valid values are 'True' or 'False'. This field can be set to true only if the bank Boost Payment option is set to  'True'. You can enable Boost payments for a buyer at any time.  But you cannot disable it (update it to false) if there are Boost suppliers present for the buyer
    BResponse:
      type: object
      properties:
        status:
          type: string
          description: Response status `success` or `error`
          enum:
          - success
          - error
        messageId:
          maxLength: 36
          type: string
          description: Unique identifier which was sent in the request.
        statusCode:
          maxLength: 6
          type: string
          description: Status code of the response. It is alphanumeric. The values are specific to each method. For the details of the various error codes returned for this method refer to the "Error Codes" table below.
        statusDesc:
          maxLength: 255
          type: string
          description: Status description of the response.
      description: Default API Response
    UpdateBillingConfig:
      type: object
      properties:
        billingBID:
          type: string
          description: The 11 digit Visa Billing BID that will be billed for the service. This is in the format of 8 digit Visa BID plus 3 digit country code. E.g. 12345678840 where 840 is country code for United States.
        billingType:
          type: string
          description: Identifies who will be billed for use of the service.  Valid Values are I, T or M.  Select I if the issuer will be billed (standard). Select T if Third party / fintech will be billed. Select M if billing needs to be manually billed (not common).
    ProxyConfigForUpdate:
      type: object
      properties:
        holdDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days an account picked up for a payment in a proxy will be kept on hold before being used for another payment.  For payments, the hold days start from the day the payment was processed and for Request Virtual Account, the hold days start from the day the end date of the RVA has reached. Should be a numeric value between 1 to 999. This field can be updated at any time.
        autoRefreshEnabled:
          type: boolean
          description: Denotes if auto replenishment is enabled for proxies associated with the buyer.  The value of this field should be set to true for VIP and VPP enabled buyers.  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for auto replenishment. This field can be updated at any time.
        bucketedProxyEnabled:
          type: boolean
          description: Denotes if bucketed proxy is enabled for proxies associated with the buyer.  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for bucketed proxy. This field can be updated only if all the proxy pools are empty.
    ContactInfoForCreate-1:
      required:
      - addressLine1
      - buyerName
      - city
      - companyId
      - contactName
      - countryCode
      - state
      - zipCode
      type: object
      properties:
        city:
          maxLength: 20
          type: string
          description: Contains the City Name of the buyer's contact address.
        state:
          maxLength: 27
          type: string
          description: Contains the state of the buyer's contact address.
        phone1:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 1. Field is alphanuemeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        phone2:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 2. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        phone3:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 3. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        buyerId:
          maxLength: 25
          pattern: ^[\d]+$
          type: string
          description: Contains the buyer identifier as defined in Visa Payables Automation. This is often the ID defined at the processor. Value format is 0–9. It is a mandatory field.
        zipCode:
          maxLength: 9
          type: string
          description: Contains the Postal Code of the buyer's contact address.  Do not include special characters, e.g. hyphen, in the zipcode.  If a special character is provided it will be removed and processed with only nine digits. Null is allowed.
        buyerName:
          maxLength: 100
          type: string
          description: Contains the name of the buyer.  It is a mandatory field.
        companyId:
          maxLength: 10
          pattern: ^[\d]+$
          type: string
          description: Contains the buyer identifier as defined at the issuer processor. Value format is 0–9. It is a mandatory field.
        phone1Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 1. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        phone2Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 2. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        phone3Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 3. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        templateId:
          maxLength: 30
          pattern: ^[\w-]+$
          type: string
          description: Contains the unique identifier for a Template asscoiated with the bank. Template id of the template which was sent in the response when you created a new template.  This field should be blank if the buyer is created without a template.
        contactName:
          maxLength: 100
          type: string
          description: Contains the name of the primary contact person in the buyer. The input should be alphabets.
        countryCode:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Contains the ISO alpha country code of the buyer's contact address. For example- USA.
        addressLine1:
          maxLength: 40
          type: string
          description: Contains the line 1 of the buyer's contact address.
        addressLine2:
          maxLength: 40
          type: string
          description: Contains the line 2 of the buyer's contact address.
        addressLine3:
          maxLength: 80
          type: string
          description: Contains the line 3 of the buyer's contact address.
        emailAddress:
          maxLength: 100
          type: string
          description: Contains the buyer's contact Email Address.  Should be an valid email address.
        implementationType:
          type: integer
          description: Valid Values are:1 – VPA UI, 2 – VPA API and 3 – Visa Commercial Pay.  Select 1 if buyer will use VPA user interface  (issuer direct use of VPA).  Select 2 if buyer is created by a third party fintech and will use the VPA APIs.  Select 3 if buyer is created in VPA for Visa Commercial Pay service.
    CreateBuyerSuccessResponse:
      type: object
      properties:
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Response for successful creation of a Buyer
    UpdateApprovalWorkflowConfig:
      type: object
      properties:
        workflowConfigEnabled:
          type: boolean
          description: Denotes if the Approval Workflow is enabled for the template (Buyer).  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.  This field can be edited only if the sync Buyer Profiles is set to false.
        workflowFunctionCodes:
          maxItems: 10
          uniqueItems: true
          type: array
          items:
            maxLength: 4
            type: string
            description: Denotes the codes for the functionalities for which Approval Workflow needs to be enabled. Valid Values are AUCL – Card Limit Update, LCRC – Lodge/New Card, PYIN – Payment Instruction, PYRN – Payment Requisition At least one function should be passed in this field if workflowconfigenabled field is set to true for the template.  This field can be edited only if the sync Buyer Profiles is set to false.
      description: Parent tag which contains the approval workflow configurations.
    PaymentSecurityConfig:
      type: object
      properties:
        customSecurityQuestions:
          maxItems: 3
          uniqueItems: true
          type: array
          description: The questions (text) which will be used at random (Only one of the questions will be displayed) to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. The system sends the security questions and answers to the supplier when the supplier is setup for the buyer.  At least one question needs to be sent if custom security question is enabled for the template.
          items:
            maxLength: 100
            type: string
            description: The size of the field should not exceed 100
        defaultSecurityQuestion:
          maxLength: 256
          type: string
          description: Denotes the text for the default security question which will be displayed to the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  If the value for this field (the tag is not sent) is not provided, the system defaults it to "Credential Text".
        defaultSecurityFieldCode:
          maxLength: 1
          type: string
          description: Denotes the field system uses to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. Valid values are '1' - Postal code and '2' - Supplier ID. If the value for this field (the tag is not sent) is not provided, the system defaults it to '1'. The default security is used only when the system creates new suppliers while processing payment files (EDI 820) or if custom security question is not enabled.
        customSecurityQuestionsEnabled:
          type: boolean
          description: Denotes if the buyer wants to use custom security questions to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  Valid values are 'True' and 'False'. Optional field. This field can be set to True only if the bank custom security questions option is set to True.
    UpdatePaymentConfig:
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment. Only numbers are allowed. This fiel can be updated at any time.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer.  For example- USD for US Dollar. It should be one of the supported active currencies in VPA. VPA system uses the billing currency as the payment currency for adjustable limit card accounts. This field cannot be updated if sync Buyer Profiles field is set to true.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: Contains the list of ISO alpha currency codes allowed for the buyer.  The buyer can process payments only in one of these currencies.  Payments made in any other currency will be rejected.  All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. Can setup up to a max of 200 currencies. Billing currency should be present in the list else the system will automatically add it to the list. Defaults to the billing currency if not provided. This field cannot be updated if the sync Buyer Profiles is set to true.
          items:
            maxLength: 3
            pattern: ^[a-zA-Z]{3}$
            type: string
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: Denotes if the payment advice should be sent at the consolidated payment level (Consolidated) or for each payment (split). Valid values are 'C' for consolidated or 'S' for split. If consolidated option is chosen, all payments to the same supplier will be consolidated and sent in one payment advice notification.  This field can be updated at any time.
        expirationBufferDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: expirationBufferDays is the number of days after the payment expiration date by which the supplier needs to complete the collection of the payment (settlement of the card transaction should be completed). Only 2 digit integer numbers are allowed. Can be updated at any time.
        securityCodeRequired:
          type: boolean
          description: Denotes if security code is needed for the supplier to collect the payment.  Valid values are 'True' or 'False'. This field can be set to true only if the bank security code (CVV2) option is set to  'True'.  This field can be updated at any time.
    ProcessorConfigForUpdate:
      type: object
      properties:
        processorFields:
          type: object
          additionalProperties:
            type: object
            properties: {}
        closeAccountEnabled:
          type: boolean
          description: Default to Yes if processor integration is enabled for the bank. Default to N if Processor integration is not enabled for the bank. Default to Y if the buyer is enabled for VIP/VPP tokens.
      description: 'This section is used if the issuer has processor integration enabled.  When using processor PANs, the following processors can be enabled for processor integration: FIS, FDR, TS1, TS2, and TSUK.    When using Visa Pseudo accounts or TSYS VANs, processor integration is not required but if it is enabled the system goes to the processor to retrieve the latest values (such as expiry date, current balance and available balance for the funding accounts).  The fields vary for each processor so refer to the details <a href="/pages/B2B-virtual-account-payment-method-codes#buyer_setup_details"> Buyer Setup Details </a> page for more information on which fields are required for each processor. If using TSYS VPP VANs or Visa VIP Pseudo Accounts, defaults values can be used.  Please refer to the Buyer Setup Details page for the defaults'
    WebServicesConfigForGetV2-1:
      type: object
      properties:
        apiCodes:
          maxItems: 200
          uniqueItems: true
          type: array
          description: Denotes the codes associated with APIs which needs to be enabled for the buyer.  The APIs should be a subset of what is enabled for the bank.  The API codes and the corresponding APIs can be found below ....
          items:
            maxLength: 10
            type: string
        clientId:
          maxLength: 40
          type: string
          description: Denotes the client id associated with the bank under which the buyer is being created.  The Visa implementation team will be providing this.
        vbdsClientId:
          maxLength: 50
          type: string
          description: vbdsClientId is the unique id generated for third parties wanting to subscribe for auth/settlement data in VBDS system.
        webServicesEnabled:
          type: boolean
          description: Denotes if the web services is enabled for the Buyer. Valid Values are 'True' and 'False'.
        vbdsDataSubscription:
          type: array
          description: This complex element captures information about the subscription to Data APIs. This is optional and if this object is not provided, the subscription defaults to bank configuration for the given vbdsClientId.
          items:
            type: object
            properties:
              dataSubscriptionType:
                type: number
