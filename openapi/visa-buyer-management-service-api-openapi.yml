    ProcessorConfig:
      type: object
      properties:
        closeAccount:
          type: boolean
          description: Denotes if the account needs to be closed at the processor.  For VIP Pseudo accounts, if this field is set to true, the pseudo account will be closed at the Visa Token System.  Valid Values are True or False.
    BuyerFeatureConfig:
      type: object
      properties:
        cardMaskingDigits:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in all places other than UI like the recon file, response file, etc. Should be Numeric. Should be between 4 and 12
        vcfDataFeedIndicator:
          type: string
          description: 'The vcfDataFeedIndicator is used for indicating the source of transactions/settlement data for this company. This value should be “Yes” if the FI/Processor is going to send settled transactions for the company [e.g. inbound Visa Commercial Format (VCF)]. It should be “No” if the company requires Visa to pull the settlement data over the Visa Network.  '
        pseudoAccountsEnabled:
          type: boolean
          description: Denotes if "Pseudo Accounts" (VIP Tokens) option is enabled for the template (buyers). Valid Values are 'True' and 'False'.  If the value for this field (the tag is not sent) is not provided, the system defaults it false.   The value can be set to true only if the bank is enabled for this Option.
        fullAccountViewEnabled:
          type: boolean
          description: Denotes if "Full Account View" functionality is enabled for the template (buyers).  Valid Values are 'True' and 'False'. If the value for this field (the tag is not sent) is not provided, the system defaults it to the bank setting for this field.   The value can be set to true only if the bank is enabled for this functionality.
        cardMaskingDigitsOnline:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in the UI. Should be Numeric. Should be between 4 and 12
        onlinePaymentInstructionEnabled:
          type: boolean
          description: Denotes if Online payment instruction (Pay Now) functionality is enabled for the template (buyers).  Valid Values are 'True' and 'False'. If the value for this field (the tag is not sent) is not provided, the system defaults it to False.     The value can be set to true only if the bank is enabled for Online Payment Instructions.
        onlinePaymentRequisitionEnabled:
          type: boolean
          description: Denotes if Online payment Requisition functionality is enabled for the template (buyers).  Valid Values are 'True' and 'False'. If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   The value can be set to true only if the bank is enabled for Online Payment Requisitions.
    ContactInfoForUpdate:
      required:
      - buyerId
      type: object
      properties:
        city:
          maxLength: 20
          type: string
          description: Contains the City Name of the buyer's contact address. This field can be updated at any time.
        state:
          maxLength: 27
          type: string
          description: Contains the state of the buyer's contact address. This field can be updated at any time.
        phone1:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 1. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        phone2:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 2. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        phone3:
          maxLength: 20
          type: string
          description: Contains the buyer contact phone number 3. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        buyerId:
          maxLength: 25
          pattern: ^[\d]+$
          type: string
          description: Contains the buyer identifier as defined in Visa Payables Automation. This is often the ID defined at the processor. Value format is 0–9.  This field is mandatory and needs to be sent to identify the buyer.  This field cannot be updated.
        zipCode:
          maxLength: 9
          type: string
          description: Optional. Contains the Postal Code of the buyer's contact address.  Do not include special characters, e.g. hyphen, in the zipcode.  If a special character is provided it will be removed and processed with only nine digits. Null is allowed.
        phone1Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 1. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        phone2Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 2. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        phone3Ext:
          maxLength: 20
          type: string
          description: Contains the extension of the buyer contact phone number 3. Field is alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).  This field can be updated at any time.
        contactName:
          maxLength: 100
          type: string
          description: Contains the name of the primary contact person in the buyer. Field is alphanumeric.  This field can be updated at any time.
        countryCode:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Contains the ISO alpha country code of the buyer's contact address. For example- USA. This field can be updated at any time.
        addressLine1:
          maxLength: 40
          type: string
          description: Contains the line 1 of the buyer's contact address.  This field can be updated at any time.
        addressLine2:
          maxLength: 40
          type: string
          description: Contains the line 2 of the buyer's contact address.  This field can be updated at any time.
        addressLine3:
          maxLength: 80
          type: string
          description: Contains the line 3 of the buyer's contact address.  This field can be updated at any time.
        emailAddress:
          maxLength: 100
          type: string
          description: Contains the buyer's contact Email Address.  Should be a valid email address.  This field will be updated only if VPC is not enabled.  If VPC is enabled, this field can be updated only if there are no accounts setup for the buyer.
        implementationType:
          type: integer
          description: Valid Values are:1 – VPA UI, 2 – VPA API and 3 – Visa Commercial Pay.  Select 1 if buyer will use VPA user interface  (issuer direct use of VPA).  Select 2 if buyer is created by a third party fintech and will use the VPA APIs.  Select 3 if buyer is created in VPA for Visa Commercial Pay service.
    UpdatePaymentNotificationConfig:
      type: object
      properties:
        dateFormat:
          maxLength: 10
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CVV tab format. Should be one of the VPA system supported date formats. This field can be updated at any time. Refer to <a href="/pages/B2B-virtual-account-payment-method-codes#date_formats">Date Formats</a> table.
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language which will be used in notifications sent to the buyer.  A valid locale (language code) should be provided. For example "en_US" for US english. Refer to the <a href="/pages/B2B-virtual-account-payment-method-codes#language_codes">Language Code</a> table for langauge codes. This field can be updated at any time.
        attachRemittanceFileDetails:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment. Valid values are 'True' or 'False'. This field can be set to true only if the bank attach remittance details file option is set to 'True'.  This field can be edited at any time.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]*$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier. Should be between 0 and 100. This value should be specified only when suppress supplier notification is disabled and supplier reminder notification is enabled for the template. This field can be edited at any time.
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment. This field can be set to true only if the bank supplier reminder notification option is set to 'True' and suppress supplier notification option for the template is set to false.  This field can be edited at any time.
    UpdateProcessorConfig:
      type: object
      properties:
        closeAccount:
          type: boolean
          description: Used to close an account
    ProcessorConfigForGet:
      type: object
      properties:
        embossedLine2:
          type: string
          description: Denotes the default embossedLine2 for cards.  This usually is the buyer name prefixed by a running number for FIS and buyer name followed by a running number for other processors
          readOnly: true
        processorFields:
          type: object
          additionalProperties:
            type: object
            properties: {}
        suaEmbossedLine1:
          type: string
          description: Denotes the default embossedLine1 for SUA cards.  This usually is the buyer name prefixed by a running number for FIS and buyer name followed by a running number for other processors
          readOnly: true
        closeAccountEnabled:
          type: boolean
          description: Default to Yes if processor integration is enabled for the bank. Default to N if Processor integration is not enabled for the bank. Default to Y if the buyer is enabled for VIP/VPP tokens.
        lodgedEmbossedLine1:
          type: string
          description: Denotes the default embossedLine1 for lodged cards.  This usually is the Supplier name prefixed by a running number for FIS and Supplier name followed by a running number for other processors
          readOnly: true
      description: 'This section is used if the issuer has processor integration enabled.  When using processor PANs, the following processors can be enabled for processor integration: FIS, FDR, TS1, TS2, and TSUK.    When using Visa Pseudo accounts or TSYS VANs, processor integration is not required but if it is enabled the system goes to the processor to retrieve the latest values (such as expiry date, current balance and available balance for the funding accounts).  The fields vary for each processor so refer to the details <a href="/pages/B2B-virtual-account-payment-method-codes#buyer_setup_details"> Buyer Setup Details </a> page for more information on which fields are required for each processor. If using TSYS VPP VANs or Visa VIP Pseudo Accounts, defaults values can be used.  Please refer to the Buyer Setup Details page for the defaults'
    GetPaymentNotificationConfig:
      type: object
      properties:
        dateFormat:
          maxLength: 10
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CVV tab format.
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language (Locale like for e.g. en_US for US english ) which will be used in notifications sent to the buyer.
        attachRemittanceFileDetails:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier.
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment.
    StripePaymentConfigForCreate:
      type: object
      properties:
        stripePaymentEnabled:
          type: boolean
          description: Denotes if Stripe payments is enabled for the buyer.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'. Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment option is set to  'True'.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the Stripe Payment Remittance notification is enabled for a buyer.  Optional field. If the value for this field (the tag is not present) is not provided, the system defaults it to 'False'. Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment Remittance Notification option is set to 'True'. The Stripe supplier will be getting the payment remittance notification only if this field is enabled.
    VanConfig:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.  If the value for this field (the tag is not sent) is not provided, the system defaults it to the bank FCS ID if there is only one setup at the bank level. Supports alphanumeric values. Required if the template is enabled for VANs.
        vanEnabled:
          type: boolean
          description: Denotes if "VANs" (VPP Tokens) are enabled for the template (buyers). Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.
    PaymentFileCommConfigForGet:
      type: object
      properties:
        edi824FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 824 outbound response file.
        edi997FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 997 outbound ack file.
        inboundFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm file ID associated with the inbound payment file (EDI 820 or SFF).
    UpdateVanConfig:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.  Supports alphanumeric values. Required if the template is enabled for VANs. Can be set at any time if it is blank.  But cannot be changed if it is already set if the sync Buyer Profiles field is set to true.
        vanEnabled:
          type: boolean
          description: Denotes if "VANs" (VPP Tokens) are enabled for the template (buyers). Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.  Can be set to true any time.  But cannot be disabled if the sync Buyer Profiles field is set to true.
    WebServicesConfig:
      type: object
      properties:
        apiCodes:
          maxItems: 200
          uniqueItems: true
          type: array
          items:
            maxLength: 10
            type: string
            description: Reserved for Future use. The system will default the apiCodes to what is set for the bank.
        clientId:
          maxLength: 40
          type: string
          description: Reserved for Future use. The system will default the client ID to what is set for the bank.
        vbdsClientId:
          maxLength: 50
          type: string
          description: vbdsClientId is the unique id generated for third parties wanting to subscribe for auth/settlement data in VBDS system.  Should be alphanumeric.
        webServicesEnabled:
          type: boolean
          description: Denotes if the web services is enabled for the template (Buyer).  Valid Values are 'True' and 'False'. If the value for this field (the tag is not sent) is not provided, the system defaults it false.   The value can be set to true only if the bank is enabled for this Option.
        suppressSupplierNotification:
          type: boolean
          description: Denotes if all supplier notifications needs to be suppressed. Valid Values are 'True' or 'False'. If this field is set to true, then the web service consumers should handle the supplier communication themselves.   If the value for this field (the tag is not sent) is not provided, the system defaults it to False.
    UpdatePaymentSecurityConfig:
      type: object
      properties:
        customSecurityQuestions:
          maxItems: 3
          uniqueItems: true
          type: array
          description: The questions (text) which will be used at random (Only one of the questions will be displayed) to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. The system sends the security questions and answers to the supplier when the supplier is setup for the buyer.  At least one question needs to be sent if custom security question is enabled for the template. This can be edited at any time and will take into effect only for future payments.
          items:
            maxLength: 100
            type: string
            description: SThe size of the field should not exceed 100
        defaultSecurityQuestion:
          maxLength: 256
          type: string
          description: Denotes the text for the default security question which will be displayed to the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. This field can be edited at any time.
        defaultSecurityFieldCode:
          maxLength: 1
          pattern: ^[\d]+$
          type: string
          description: Denotes the field system uses to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. Valid values are '1' - Postal code and '2' - Supplier ID. If the value for this field (the tag is not sent) is not provided, the system defaults it to '1'.  The default security is used only when the system creates new suppliers while processing payment files (EDI 820) or if custom security question is not enabled. This field can be edited at any time.
        customSecurityQuestionsEnabled:
          type: boolean
          description: Denotes if the buyer wants to use custom security questions to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  Valid values are 'True' and 'False'. This field can be set to True only if the bank custom security questions option is set to True. This field can be edited at any time.
    BuyerFeatureConfigForGet:
      type: object
      properties:
        cardMaskingDigits:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in all places other than UI like the recon file, response file, etc.
        pseudoAccountsEnabled:
          type: boolean
          description: Denotes if "Pseudo Accounts" (VIP Tokens) option is enabled for the buyer.
        fullAccountViewEnabled:
          type: boolean
          description: Denotes if "Full Account View" functionality is enabled for the buyer.
        cardMaskingDigitsOnline:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in the UI.
        onlinePaymentInstructionEnabled:
          type: boolean
          description: Denotes if Online payment instruction (Pay Now) functionality is enabled for the buyer.
        onlinePaymentRequisitionEnabled:
          type: boolean
          description: Denotes if Online payment Requisition functionality is enabled for the buyer.
    CreateBuyerRequest-3:
      required:
      - clientId
      - contactInfo
      - messageId
      type: object
      properties:
        clientId:
          maxLength: 25
          type: string
          description: ClientID uniquely identifies a financial institution. This will be provided by Visa implementation team.
        messageId:
          maxLength: 36
          type: string
          description: Unique identifier for identifying the request.
        vanConfig:
          $ref: '#/components/schemas/VanConfigForCreate'
        contactInfo:
          $ref: '#/components/schemas/ContactInfoForCreate-1'
        proxyConfig:
          $ref: '#/components/schemas/ProxyConfigForCreate'
        billingConfig:
          $ref: '#/components/schemas/BillingConfigForCreate'
        paymentConfig:
          $ref: '#/components/schemas/PaymentConfigForCreate'
        processorConfig:
          $ref: '#/components/schemas/ProcessorConfigForCreate'
        stpPaymentConfig:
          $ref: '#/components/schemas/StpPaymentConfigForCreate'
        paymentFileConfig:
          $ref: '#/components/schemas/PaymentFileCommConfigForCreate'
        webServicesConfig:
          $ref: '#/components/schemas/WebServicesConfigForCreate-2'
        boostPaymentConfig:
          $ref: '#/components/schemas/BoostPaymentConfigForCreate'
        buyerFeatureConfig:
          $ref: '#/components/schemas/BuyerFeatureConfigForCreate'
        responseFileConfig:
          $ref: '#/components/schemas/ResponseFileConfigForCreate-1'
        stripePaymentConfig:
          $ref: '#/components/schemas/StripePaymentConfigForCreate'
        paymentSecurityConfig:
          $ref: '#/components/schemas/PaymentSecurityConfigForCreate'
        approvalWorkflowConfig:
          $ref: '#/components/schemas/ApprovalWorkflowConfigForCreate'
        reconciliationFileConfig:
          $ref: '#/components/schemas/ReconciliationFileConfigForCreate-1'
        paymentNotificationConfig:
          $ref: '#/components/schemas/PaymentNotificationConfigForCreate'
        authorizationControlConfig:
          $ref: '#/components/schemas/AuthorizationControlConfigForCreate'
        rvaReconciliationFileConfig:
          $ref: '#/components/schemas/RvaReconciliationFileConfigForCreate-1'
      description: Buyer Profile Details for creating a new buyer.
    GetAuthorizationControlConfig:
      type: object
      properties:
        alertsEnabled:
          type: boolean
          description: Denotes if the system needs to send an alert when an authorization on a VPC enabled card is approved or declined.
        issuerHoldingBID:
          maxLength: 8
          pattern: ^[\d]+$
          type: string
          description: Denotes the Holding BID (business id) for the issuer.
        authControlEnabled:
          type: boolean
          description: Denotes if the authorization controls needs to be enabled for the template (in turn the buyer).  Auth controls is mandated for VPP and VIP buyers.
    UpdateWebServicesConfig:
      type: object
      properties:
        apiCodes:
          maxItems: 200
          uniqueItems: true
          type: array
          items:
            maxLength: 10
            type: string
            description: Reserved for Future use. The system will default the apiCodes to what is set for the bank.
        clientId:
          maxLength: 40
          type: string
          description: Reserved for Future use. The system will default the client ID to what is set for the bank.
        vbdsClientId:
          maxLength: 50
          type: string
          description: vbdsClientId is the unique id generated for third parties wanting to subscribe for auth/settlement data in VBDS system.  Should be alphanumeric.  Can be set at any time if it is blank.  But cannot be changed if it is already set if the sync Buyer Profiles field is set to true.
        webServicesEnabled:
          type: boolean
          description: Denotes if the web services is enabled for the template (Buyer).  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option. Can be enabled (set to true) at any time.  But cannot be disabled if sync Buyer Profiles field is set to true.
        suppressSupplierNotification:
          type: boolean
          description: Denotes if all supplier notifications needs to be suppressed.  If this field is set to true, then the web service consumers should handle the supplier communication themselves. Valid Values are 'True' or 'False'. This field can be edited at any time.
    UpdateSTPPaymentConfig:
      type: object
      properties:
        stpPaymentEnabled:
          type: boolean
          description: Denotes if the STP Payments is enabled for a template (buyer).Optional field.  Valid values are 'True' or 'False'. This field can be set to true only if the bank STP Payments option is set to  'True'.  This field can be enabled (set to true) at any time but cannot be disabled if the sync Buyer Profiles is set to true.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the STP Payment Remittance notification is enabled for a template (buyer).  Valid values are 'True' or 'False'. This field can be set to true only if the bank STP Payment Remittance Notification option is set to 'True'. Only if this field is enabled, the STP supplier will be getting the payment remittance notification. This field can be edited at any time.
    BillingConfigForCreate:
      type: object
      properties:
        billingBID:
          type: string
          description: The 11 digit Visa Billing BID that will be billed for the service. This is in the format of 8 digit Visa BID plus 3 digit country code. E.g. 12345678840 where 840 is country code for United States.
        billingType:
          type: string
          description: Identifies who will be billed for use of the service.  I indicates issuer will be billed (standard). T indicates Third party / fintech will be billed. M indicates manual billing is set up.
    GetProcessorConfig:
      type: object
      properties:
        closeAccount:
          type: boolean
          description: Used to close an account
    ApprovalWorkflowConfigForUpdate:
      type: object
      properties:
        workflowConfigEnabled:
          type: boolean
          description: Denotes if the Approval Workflow is enabled for the Buyer.  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option. This field can be updated to true at any time.  But cannot be updated to false.
        workflowFunctionCodes:
          uniqueItems: true
          type: array
          description: Denotes the codes for the functionalities for which Approval Workflow needs to be enabled. Valid Values are AUCL - Card Limit Update, LCRC - Lodge/New Card, PYIN - Payment Instruction, PYRN - Payment Requisition At least one function should be passed in this field if workflowconfigenabled field is set to true for the buyer.  This field can be updated at any time.
          items:
            pattern: ^[a-zA-Z]{4}$
            type: string
            enum:
            - AUCL
            - LCRC
            - PYIN
            - PYRN
    GetBuyerTemplateSuccessResponseV2:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/GetBuyerTemplateResponseV2'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Get Buyer Template Success Response V2
    CreateBuyerTemplateResponse:
      required:
      - templateId
      type: object
      properties:
        templateId:
          maxLength: 30
          type: string
          description: Unique Identifier for a Template. It should be alphanumeric.  Should be an existing template id associated with the bank (associated to the client id).  The template id is returned in the response of the CreateTemplate API.
      description: Create Buyer Template Response
    UpdateBuyerTemplateResponse:
      required:
      - templateId
      type: object
      properties:
        templateId:
          maxLength: 30
          type: string
          description: Unique Identifier for a Template. It should be alphanumeric.  Should be an existing template id associated with the bank (associated to the client id).  The template id is returned in the response of the CreateTemplate API.
      description: Update Buyer Template Response
    PaymentNotificationConfigForCreate:
      type: object
      properties:
        dateFormat:
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CSV or tab format. Should be one of the VPA system supported date formats. This field is required. Refer to <a href="/pages/B2B-virtual-account-payment-method-codes#date_formats">Date Formats</a> table.
          format: date
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language which will be used in notifications sent to the buyer.  A valid locale (language code) should be provided. For example "en_US" for US english. If the value for this field is not provided, the system defaults it to 'en_US'. Refer to the <a href="/pages/B2B-virtual-account-payment-method-codes#language_codes">Language Code</a> table for langauge codes.
          example: en_us
        attachRemittanceDetailsFile:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to value set for this option for the bank. Valid values are 'True' or 'False'. This field can be set to true only if the bank attach remittance details file option is set to 'True'.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier. Optional Field.  If the value for this field (the tag is not sent) is not provided, the system defaults it to 7 days. Should be between 0 and 100. This value should be specified only when suppress supplier notification is disabled and supplier reminder notification is enabled for the buyer.
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment.   If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False' if the suppress supplier notification is enabled and to 'True' if the suppress supplier notifiation is disabled.  This field can be set to true only if the bank supplier reminder notification option is set to 'True' and suppress supplier notification option for the buyer is set to false.
    PaymentConfigForGet:
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer. All ISO alpha currency codes will be supported. For example- USD for US Dollar. VPA system uses the billing currency as the payment currency for adjustable limit card accounts.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: The list of currencies allowed for the buyer.  The buyer can process payments in any of these currencies.  Any payments made using any other currencies will be rejected.  All ISO alpha currency codes will be supported. For example- USD for US Dollar.
          items:
            pattern: ^[a-zA-Z]{3}$
            type: string
        defaultSecurityCode:
          type: boolean
          description: Denotes if the security code needs to be enabled by default for all the new suppliers created.
          readOnly: true
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: This option is used by the system to decide if all payments to the same supplier should be consolidated or sent separately in the payment advice notificaion.
        expirationBufferDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: expirationBufferDays is the number of days after the payment expiration date by which the supplier needs to complete the collection of the payment (settlement of the card transaction should be completed).
        securityCodeRequired:
          type: boolean
          description: Denotes if security code is needed for the supplier to collect the payment.
    GetBuyerFeatureConfigV2:
      type: object
      properties:
        cardMaskingDigits:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in all places other than UI like the recon file, response file, etc.
        vcfDataFeedIndicator:
          type: string
          description: 'The vcfDataFeedIndicator is used for indicating the source of transactions/settlement data for this company. This value should be “Yes” if the FI/Processor is going to send settled transactions for the company [e.g. inbound Visa Commercial Format (VCF)]. It should be “No” if the company requires Visa to pull the settlement data over the Visa Network.  '
        pseudoAccountsEnabled:
          type: boolean
          description: Denotes if "Pseudo Accounts" (VIP Tokens) option is enabled for the template (buyers).
        fullAccountViewEnabled:
          type: boolean
          description: Denotes if "Full Account View" functionality is enabled for the template (buyers).
        cardMaskingDigitsOnline:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in the UI.
        onlinePaymentInstructionEnabled:
          type: boolean
          description: Denotes if Online payment instruction (Pay Now) functionality is enabled for the template (buyers).
        onlinePaymentRequisitionEnabled:
          type: boolean
          description: Denotes if Online payment Requisition functionality is enabled for the template (buyer).
    ReconciliationFileConfigForCreate-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company.
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the recon file outbound. Required if the file level is B. The Visa implementation team provides this value after the outbound recon file configuration has been completed.
        fileFormat:
          type: integer
          description: Denotes the format in which the recon file needs to be generated. Needs to be numeric. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        deliveryTime:
          maxLength: 6
          type: string
          description: Denotes the delivery type or day when the recon file needs to be generated and delivered. If the value for this field (the tag is not sent) is not provided, the system defaults it to'1:00' AM for the daily frequency and 2 for weekly and 1 for monthly frequency.   Valid format for the time for the daily frequency is 'HH:MM' in 24 hours format.  Valid values for the Weekly frequency  1 to 7 denoting the days.  1 being Sunday and 7 being Saturday and Monthly Frequency 1 to 31
        templateName:
          maxLength: 100
          type: string
          description: Denotes the name of the recon template to be used for generating the reconciliation file. If the value for this field (the tag is not sent) is not provided, the system defaults it to the latest recon standard template.
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the recon file needs to be delivered. Needs to be numeric. Valid values are 1 – Daily 2 – Weekly 3 - Monthly
        recipientLoginIds:
          maxItems: 80
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the recon file in their VOL mailbox. You can setup upto 80 user ids to receive the recon file. The user ids should have the VOL mailbox service entitled to them.
          items:
            type: string
        adhocReconciliationReportEnabled:
          type: boolean
          description: Denotes if Adhoc Reconciliation functionality is enabled for the buyer. If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for Adhoc Reconciliation.
        onlinePaymentReconciliationEnabled:
          type: boolean
          description: Denotes if Online payment Reconciliation functionality is enabled for the buyers.  If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for Online Payment Reconciliation.
    GetReconciliationFileConfig:
      type: object
      properties:
        commFileId:
          maxLength: 40
          type: string
          description: Comm file Id refers to Comm File info associated with the recon file outbound delivery.Required if ReconFileDelivery is set to Comms.
        templateName:
          maxLength: 100
          type: string
          description: Denotes the name of the custom Reconciliation template to be used for generating the reconciliation file for all buyers using the template.
        adhocReconciliationReportEnabled:
          type: boolean
          description: Denotes if Adhoc Reconciliation functionality is enabled for the template (buyers).
        onlinePaymentReconciliationEnabled:
          type: boolean
          description: Denotes if Online payment Reconciliation functionality is enabled for the template (buyers).
    UpdateBoostPaymentConfig:
      type: object
      properties:
        boostPaymentEnabled:
          type: boolean
          description: Denotes if the Boost Payments is enabled for a template (buyer).Optional field.  Valid values are 'True' or 'False'. This field can be set to true only if the bank Boost Payments option is set to  'True'.  This field can be enabled (set to true) at any time but cannot be disabled if the sync Buyer Profiles is set to true.
    ProxyConfigForGet:
      type: object
      properties:
        holdDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days an account picked up for a payment in a proxy will be kept on hold before being used for another payment.  For payments, the hold days start from the day the payment was processed and for Request Virtual Account, the hold days start from the day the end date of the RVA has reached.
        autoRefreshEnabled:
          type: boolean
          description: Denotes if auto replenishment is enabled for proxies associated with the buyer.
        bucketedProxyEnabled:
          type: boolean
          description: Denotes if bucketed proxy is enabled for proxies associated with the buyer.  Valid Values are 'True' and 'False'.
    WebServicesConfigForGet:
      type: object
      properties:
        apiCodes:
          maxItems: 200
          uniqueItems: true
          type: array
          description: Denotes the codes associated with APIs which needs to be enabled for the buyer.  The APIs should be a subset of what is enabled for the bank.  The API codes and the corresponding APIs can be found below ....
          items:
            maxLength: 10
            type: string
        clientId:
          maxLength: 40
          type: string
          description: Denotes the client id associated with the bank under which the buyer is being created.  The Visa implementation team will be providing this.
        vbdsClientId:
          maxLength: 50
          type: string
          description: vbdsClientId is the unique id generated for third parties wanting to subscribe for auth/settlement data in VBDS system.
        webServicesEnabled:
          type: boolean
          description: Denotes if the web services is enabled for the Buyer. Valid Values are 'True' and 'False'.
        suppressSupplierNotification:
          type: boolean
          description: Denotes if all supplier notifications needs to be suppressed.  If this field is set to true, then the web service consumers should handle the supplier communication themselves. Valid Values are 'True' or 'False'.
    PaymentNotificationConfigForGet:
      type: object
      properties:
        dateFormat:
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CSV or tab format.
          format: date
        settlementSource:
          type: string
          description: Denotes if the settlement is sourced from VIDS (1) or from VCF (2).
          readOnly: true
        paymentAdviceTemplate:
          type: string
          description: Denotes the name of the email template which will be used for generating the email notifications.
          readOnly: true
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language which will be used in notifications sent to the buyer.
          example: en_us
        attachRemittanceDetailsFile:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier.
        defaultAttachRemittanceDetailsFile:
          type: boolean
          description: Denotes if the “Attach Remittance Details” option needs to be enabled by default for all the new suppliers created.
          readOnly: true
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment.
        defaultSupplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the “Reminder Notification” option needs to be enabled by default for all the new suppliers created.
          readOnly: true
    UpdateAuthorizationControlConfig:
      type: object
      properties:
        alertsEnabled:
          type: boolean
          description: Denotes if the system needs to send an alert when an authorization on a VPC enabled card is approved or declined.  Valid values are 'True' and 'False'. This field can be set to True only if the authControlEnabled is set to true for the template. This field can be edited only if the sync Buyer Profiles is set to false.
        issuerHoldingBID:
          maxLength: 8
          pattern: ^[\d]*$
          type: string
          description: Denotes the Holding BID (business id) for the issuer.  Should be numeric. Should be set only if authControlEnabled is set to true for the template. This field can be edited only if the sync Buyer Profiles is set to false.
        authControlEnabled:
          type: boolean
          description: Denotes if the authorization controls needs to be enabled for the template (in turn the buyer).  Auth controls is mandated for VPP and VIP buyers. Valid values are true or false. This field can be edited only if the sync Buyer Profiles is set to false.
    UpdateContactInfo:
      type: object
      properties:
        phone1:
          maxLength: 20
          type: string
          description: Denotes the buyer contact phone number. Should be alphanumeric Can be updated at any time.  Special characters allowed are - (dash), ( (Open braces),) (close braces).
        emailAddress:
          maxLength: 100
          type: string
          description: Denotes the buyer's contact Email Address.  Should be an valid email address.
        implementationType:
          type: integer
          description: Valid Values are:1 – VPA UI, 2 – VPA API and 3 – Visa Commercial Pay.  Select 1 if buyer will use VPA user interface  (issuer direct use of VPA).  Select 2 if buyer is created by a third party fintech and will use the VPA APIs.  Select 3 if buyer is created in VPA for Visa Commercial Pay service.
    BoostPaymentConfigForGet:
      type: object
      properties:
        boostPaymentEnabled:
          type: boolean
          description: Denotes if Boost payments is enabled for the buyer.
    PaymentConfigForCreate:
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment. Only numbers are allowed. If the parameter is not provided, system default this value to 30.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer. All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. VPA system uses the billing currency as the payment currency for adjustable limit card accounts.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: The list of currencies allowed for the buyer.  The buyer can process payments in any of these currencies.  Any payments made other than these currencies will be rejected.  All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. Can setup up to a max of 200 currencies. Billing currency should be present in the list else the system will automatically add it to the list. Defaults to the billing currency if not provided.
          items:
            pattern: ^[a-zA-Z]{3}$
            type: string
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: This option is used by the system to decide if all payments to the same supplier should be consolidated or sent separately in the payment advice notificaion.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'C'. Valid values are 'C' for consolidated or 'S' for split.
        expirationBufferDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: expirationBufferDays is the number of days after the payment expiration date by which the supplier needs to complete the collection of the payment (settlement of the card transaction should be completed). Only numbers are allowed. If the parameter is not provided, system default this value to 5.
        securityCodeRequired:
          type: boolean
          description: Denotes if security code is needed for the supplier to collect the payment. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to the value set for the bank for this field. Valid values are 'True' or 'False'. This field can be set to true only if the bank security code (CVV2) option is set to  'True'.
    PaymentSecurityConfigForUpdate:
      type: object
      properties:
        customSecurityQuestions:
          maxItems: 3
          uniqueItems: true
          type: array
          description: The questions (text) which will be used at random (Only one of the questions will be displayed) to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. The system sends the security questions and answers to the supplier when the supplier is setup for the buyer.  At least one question needs to be sent if custom security question is enabled for the buyer. This field can be updated at any time and will be used only for future payments.
          items:
            maxLength: 100
            type: string
        defaultSecurityQuestion:
          maxLength: 256
          type: string
          description: Denotes the text for the default security question which will be displayed to the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  This field can be updated at any time and will be used only for future payments.
        defaultSecurityFieldCode:
          maxLength: 1
          type: string
          description: Denotes the field system uses to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. Valid values are '1' - Postal code and '2' - Supplier ID. The default security is used only when the system creates new suppliers while processing payment files (EDI 820) or if custom security question is not enabled. This field can be updated at any time and will be used only for future payments.
        customSecurityQuestionsEnabled:
          type: boolean
          description: Denotes if the buyer wants to use custom security questions to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  Valid values are 'True' and 'False'. This field can be set to True only if the bank custom security questions option is set to True. This field can be updated at any time and will be used only for future payments.
    GetBuyerFeatureConfig:
      type: object
      properties:
        cardMaskingDigits:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in all places other than UI like the recon file, response file, etc.
        pseudoAccountsEnabled:
          type: boolean
          description: Denotes if "Pseudo Accounts" (VIP Tokens) option is enabled for the template (buyers).
        fullAccountViewEnabled:
          type: boolean
          description: Denotes if "Full Account View" functionality is enabled for the template (buyers).
        cardMaskingDigitsOnline:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in the UI.
        onlinePaymentInstructionEnabled:
          type: boolean
          description: Denotes if Online payment instruction (Pay Now) functionality is enabled for the template (buyers).
        onlinePaymentRequisitionEnabled:
          type: boolean
          description: Denotes if Online payment Requisition functionality is enabled for the template (buyer).
    WebServicesConfigForUpdate-1:
      type: object
      properties:
        apiCodes:
          maxItems: 200
          uniqueItems: true
          type: array
          description: Reserved for Future use. The system will default the apiCodes to what is set for the bank.
          items:
            maxLength: 10
            type: string
        clientId:
          maxLength: 40
          type: string
          description: Reserved for Future use. The system will default the client ID to what is set for the bank.
        vbdsClientId:
          maxLength: 50
          type: string
          description: vbdsClientId is the unique id generated for third parties wanting to subscribe for auth/settlement data in VBDS system. Should be numeric.  This field can be editedat any time.
        webServicesEnabled:
          type: boolean
          description: Denotes if the web services is enabled for the Buyer. Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.  This field can be enabled at any time but cannot be disabled.
        vbdsDataSubscription:
          type: array
          description: This complex element captures information about the subscription to Data APIs. This is optional and if this object is not provided, the subscription defaults to bank configuration for the given vbdsClientId.
          items:
            type: object
            properties:
              dataSubscriptionType:
                type: number
                description: 'This field is mandatory if vbdsDataSubcription object is provided. This field accepts the following subscription types. Provide the numeric code associated with the API(s) you want to subscribe to: 5001(Transaction Data API), 5003(Starter Data API), 5004(Authorization Data API (Pull)), 5005(Authorization Data API (Push))'
              dataSubscriptionAccountType:
                type: array
                description: This is optional. If no value is provided, all the account types enabled at the bank level for the client are subscribed to the APIs specified in dataSubscriptionType.  Subscribe/unsubscribe is allowed only for the account types enabled at the bank level for the provided client.
                items:
                  type: object
                  properties:
                    subscribed:
                      type: boolean
                      description: 'This field indicates if the accountType should be susbcribed to the specified Data API(s).  E.g. if you want to subscribe the account type to the API provide ''true'' here.  To unsubscribe an account type to an API, provide ''false''. Valid Values are ''True'' and ''False''.The valid value must be provided for the account type.  '
                    accountType:
                      type: string
                      description: 'This field accepts following values. Please use the 4-character alpha code: VIPT:VIP / Pseudo Account:Pseudo Account generated by Visa, NVPA:Non virtual account:Physical cards, MEMO:Processor account:Virtual accounts generated at the Processor, FUNA:Funding Account:Parent Account for Visa Pseudo Accounts or TSYS VPP VAN tokens, VPPT:VPP Token:TSYS generated tokens (Also referred to as TSYS VPP VANs)'
        suppressSupplierNotification:
          type: boolean
          description: Denotes if all supplier notifications needs to be suppressed.  If this field is set to true, then the web service consumers should handle the supplier communication themselves.    Valid Values are 'True' or 'False'. This field can be updated at any time.
    StripePaymentConfigForGet:
      type: object
      properties:
        stripePaymentEnabled:
          type: boolean
          description: Denotes if Stripe payments is enabled for the buyer.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the Stripe Payment Remittance notification is enabled for a buyer. The Stripe supplier will be getting the payment remittance notification only if this field is enabled.
    RvaReconciliationFileConfigForGet:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the RVA recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company.
        commFileId:
          type: string
          description: Denotes the Comm File ID associated with the RVA recon file outbound.  The COMM file definition should exist in the system.  The Visa implementation team provides this value after the outbound RVA recon file configuration has been completed.
        fileFormat:
          type: integer
          description: Denotes the format in which the RVA recon file needs to be generated. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        templateId:
          maxLength: 5
          type: string
          description: Denotes the id of the recon template to be used for generating the RVA reconciliation file. Valid values are 1 - RVA Recon standard template Version 1.0
        deliveryTime:
          maxLength: 6
          type: string
          description: Denotes the delivery type or day when the RVA recon file needs to be generated and delivered.  Valid format for the time for the daily frequency is 'HH:MM' in 24 hours format.  Valid values for the Weekly frequency  1 to 7 denoting the days.  1 being Sunday and 7 being Saturday and Monthly Frequency 1 to 31
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the RVA recon file needs to be delivered.  Valid values are 1 – Daily 2 – Weekly 3 - Monthly
        recipientLoginIds:
          maxItems: 50
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the RVA recon file in their VOL mailbox.
          items:
            type: string
    PaymentConfig:
      required:
      - billingCurrency
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment. Only numbers are allowed. If the parameter is not provided, system default this value to 30.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer. All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. VPA system uses the billing currency as the payment currency for adjustable limit card accounts.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: The list of currencies allowed for the buyer.  The buyer can process payments in any of these currencies.  Any payments made other than these currencies will be rejected.  All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. Can setup up to a max of 200 currencies. Billing currency should be present in the list else the system will automatically add it to the list. Defaults to the billing currency if not provided.
          items:
            maxLength: 3
            pattern: ^[a-zA-Z]{3}$
            type: string
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: Denotes if all payments to the same supplier in the same payment file will be consolidated and sent in one payment advice notification. Valid values are 'C' for consolidated or 'S' for split. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'C'.
        expirationBufferDays:
          maxLength: 2
