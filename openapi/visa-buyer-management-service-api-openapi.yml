          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the response file in their VOL mailbox.
          items:
            type: string
    ProxyConfigForCreate:
      type: object
      properties:
        holdDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days an account picked up for a payment in a proxy will be kept on hold before being used for another payment.  For payments, the hold days start from the day the payment was processed and for Request Virtual Account, the hold days start from the day the end date of the RVA has reached. Should be a numeric value between 1 to 999. If the value for this field (the tag is not sent) is not provided, the system defaults it to 90 days.
        autoRefreshEnabled:
          type: boolean
          description: Denotes if auto replenishment is enabled for proxies associated with the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it to False for memo account buyers and to true for VIP and VPP enabled buyers.   The value of this field should be set to true for VIP and VPP enabled buyers.  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for auto replenishment.
        bucketedProxyEnabled:
          type: boolean
          description: Denotes if bucketed proxy is enabled for proxies associated with the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for bucketed proxy.
    GetBuyerSuccessResponse:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/GetBuyerResponse'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Response for a successful fetch of a Buyer
    ResponseFileConfig:
      type: object
      properties:
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the Response file outbound.
    ReconciliationFileConfigForUpdate-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company.  This field can be updated at any time.
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the recon file outbound.  The COMM file definition should exist in the system.  The Visa implementation team provides this value after the outbound recon file configuration has been completed. This field can be updated at any time.
        fileFormat:
          type: integer
          description: Denotes the format in which the recon file needs to be generated. Needs to be numeric. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1.   This field can be updated at any time.
        deliveryTime:
          maxLength: 6
          type: string
          description: Denotes the delivery type or day when the recon file needs to be generated and delivered. If the value for this field (the tag is not sent) is not provided, the system defaults it to'1:00' AM for the daily frequency and 1 for weekly and monthly frequency.   Valid format for the time for the daily frequency is 'HH:MM' in 24 hours format.  Valid values for the Weekly frequency  1 to 7 denoting the days.  1 being Sunday and 7 being Saturday and Monthly Frequency 1 to 31. This field can be updated at any time.
        templateName:
          maxLength: 100
          type: string
          description: Denotes the name of the recon template to be used for generating the reconciliation file.  This field can be updated at any time.
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the recon file needs to be delivered. Needs to be numeric. Valid values are 1 – Daily 2 – Weekly 3 - Monthly. This field can be updated at any time.
        recipientLoginIds:
          maxItems: 80
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the recon file in their VOL mailbox. You can setup upto 80 user ids to receive the recon file. The user ids should have the VOL mailbox service entitled to them.This field can be updated at any time.
          items:
            type: string
        adhocReconciliationReportEnabled:
          type: boolean
          description: Denotes if Adhoc Reconciliation functionality is enabled for the buyer. Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for Adhoc Reconciliation.  This field can be updated at any time.
        onlinePaymentReconciliationEnabled:
          type: boolean
          description: Denotes if Online payment Reconciliation functionality is enabled for the buyers.  Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for Online Payment Reconciliation.  This field can be updated at any time.
    GetPaymentConfig:
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: The list of currencies (ISO alpha currency codes) allowed for the buyer.  The buyer can process payments in any of these currencies.  Any payments made other than these currencies will be rejected.
          items:
            maxLength: 3
            pattern: ^[a-zA-Z]{3}$
            type: string
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: Denotes if all payments to the same supplier in a payment file will be consolidated (Consolidated option - C) or sent separately (Split Option - S) and sent in one payment advice notification.
        expirationBufferDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: expirationBufferDays is the number of days after the payment expiration date by which the supplier needs to complete the collection of the payment (settlement of the card transaction should be completed).
        securityCodeRequired:
          type: boolean
          description: Denotes if CVV2 is required for processing the payment.
    GetBuyerTemplateSuccessResponse:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/GetBuyerTemplateResponse'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Get Buyer Template Success Response
    GetProxyConfig:
      type: object
      properties:
        holdDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days an account picked up for a payment in a proxy will be kept on hold before being used for another payment.  For payments, the hold days start from the day the payment was processed and for Request Virtual Account, the hold days start from the day the end date of the RVA has reached.
        autoRefreshEnabled:
          type: boolean
          description: Denotes if auto replenishment is enabled for proxies associated with the template (buyers).
        bucketedProxyEnabled:
          type: boolean
          description: Denotes if bucketed proxy is enabled for proxies associated with the template (buyers).
    UpdateBuyerTemplateSuccessResponse:
      type: object
      properties:
        responseObject:
          $ref: '#/components/schemas/UpdateBuyerTemplateResponse'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Update Buyer Template Success Response
    Response:
      type: object
      properties:
        status:
          type: string
          description: Response status `success` or `error`
          enum:
          - success
          - error
        messageId:
          maxLength: 36
          type: string
          description: Unique identifier for identifying the request.
        statusCode:
          maxLength: 6
          type: string
          description: Status code of the response. It is alphanumeric. The values are specific to each method. For the details of the various error codes returned for this method refer to the "Error Codes" table below.
        statusDesc:
          maxLength: 255
          type: string
          description: Status description of the response.
      description: Default API Response
    UpdateStripePaymentConfig:
      type: object
      properties:
        stripePaymentEnabled:
          type: boolean
          description: Denotes if Stripe payments is enabled for the template (buyer).  Optional field.  Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment option is set to  'True'. This field can be enabled (set to true) at any time but cannot be disabled if the sync Buyer Profiles is set to true.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the Stripe Payment Remittance notification is enabled for a template (buyer).  Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment Remittance Notification option is set to 'True'. Only if this field is enabled, the Stripe supplier will be getting the payment remittance notification. This field can be edited at any time.
    PaymentFileCommConfigForCreate:
      type: object
      properties:
        edi824FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 824 outbound response file.  The COMM file definition should exist in the system.  The Visa implementation team provides this value after the inbound file configuration has been completed.
        edi997FileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the EDI 997 outbound ack file. The COMM file definition should exist in the system.  The Visa implementation team provides this value after the inbound file configuration has been completed.
        inboundFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm file ID associated with the inbound payment file (EDI 820 or SFF). The COMM file definition should exist in the system.  The Visa implementation team provides this value after the inbound file configuration has been completed.
    GetBuyerTemplateResponse:
      type: object
      properties:
        vanConfig:
          $ref: '#/components/schemas/GetVanConfig'
        templateId:
          maxLength: 30
          type: string
          description: Unique Identifier for a Template. It should be alphanumeric.  Should be an existing template id associated with the bank (associated to the client id).  The template id is returned in the response of the GetTemplate API.
        contactInfo:
          $ref: '#/components/schemas/GetContactInfo'
        proxyConfig:
          $ref: '#/components/schemas/GetProxyConfig'
        templateName:
          maxLength: 50
          type: string
          description: Name of the template
        billingConfig:
          $ref: '#/components/schemas/GetBillingConfig'
        paymentConfig:
          $ref: '#/components/schemas/GetPaymentConfig'
        processorConfig:
          $ref: '#/components/schemas/GetProcessorConfig'
        stpPaymentConfig:
          $ref: '#/components/schemas/GetSTPPaymentConfig'
        webServicesConfig:
          $ref: '#/components/schemas/GetWebServicesConfig'
        boostPaymentConfig:
          $ref: '#/components/schemas/GetBoostPaymentConfig'
        buyerFeatureConfig:
          $ref: '#/components/schemas/GetBuyerFeatureConfig'
        responseFileConfig:
          $ref: '#/components/schemas/GetResponseFileConfig'
        stripePaymentConfig:
          $ref: '#/components/schemas/GetStripePaymentConfig'
        templateDescription:
          maxLength: 256
          type: string
          description: Description of the template.
        paymentFileCommConfig:
          $ref: '#/components/schemas/GetPaymentFileCommConfig'
        paymentSecurityConfig:
          $ref: '#/components/schemas/GetPaymentSecurityConfig'
        approvalWorkflowConfig:
          $ref: '#/components/schemas/GetApprovalWorkflowConfig'
        reconciliationFileConfig:
          $ref: '#/components/schemas/GetReconciliationFileConfig'
        paymentNotificationConfig:
          $ref: '#/components/schemas/GetPaymentNotificationConfig'
        authorizationControlConfig:
          $ref: '#/components/schemas/GetAuthorizationControlConfig'
        rvaReconciliationFileConfig:
          $ref: '#/components/schemas/GetRVAReconciliationFileConfig'
      description: Get Buyer Template Response
    PaymentNotificationConfig:
      required:
      - dateFormat
      type: object
      properties:
        dateFormat:
          maxLength: 10
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CVV tab format. Should be one of the VPA system supported date formats. This field is required. Refer to <a href="/pages/B2B-virtual-account-payment-method-codes#date_formats">Date Formats</a> table.
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language which will be used in notifications sent to the buyer.  A valid locale (language code) should be provided. For example "en_US" for US english. If the value for this field is not provided, the system defaults it to 'en_US'. Refer to the <a href="/pages/B2B-virtual-account-payment-method-codes#language_codes">Language Code</a> table for langauge codes.
        attachRemittanceFileDetails:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment.  Valid values are 'True' or 'False'. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to value set for this option for the bank.  This field can be set to true only if the bank attach remittance details file option is set to 'True'.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier. Optional Field.  If the value for this field (the tag is not sent) is not provided, the system defaults it to 7 days. Should be between 0 and 100. This value should be specified only when suppress supplier notification is disabled and supplier reminder notification is enabled for the template.
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment.   If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False' if the suppress supplier notification is enabled and to 'True' if the suppress supplier notifiation is disabled.  This field can be set to true only if the bank supplier reminder notification option is set to 'True' and suppress supplier notification option for the template is set to false.
    UpdateBuyerTemplateRequest:
      required:
      - clientId
      - messageId
      - templateId
      type: object
      properties:
        clientId:
          maxLength: 25
          type: string
          description: Denotes the client ID associated with the bank for which the template is being defined.  Should be alphanumeric and should exist in the system.  Visa will provide this during implementation.  This field cannot be updated.
        messageId:
          maxLength: 36
          type: string
          description: Unique identifier for this request.  Each request sent to VPA requires its own unique ID.
        vanConfig:
          $ref: '#/components/schemas/UpdateVanConfig'
        templateId:
          maxLength: 30
          type: string
          description: Unique Identifier for a Template. It should be alphanumeric.  Should be an existing template id associated with the bank (associated to the client id).  The template id is returned in the response of the CreateTemplate API.
        contactInfo:
          $ref: '#/components/schemas/UpdateContactInfo'
        proxyConfig:
          $ref: '#/components/schemas/UpdateProxyConfig'
        templateName:
          maxLength: 50
          type: string
          description: Name of the template.  Can be updated at any time. Alphanumeric. No special characters other than _ - * & ' ! , . '#' and â€“ (Dash) are allowed. It has to be unique within a Bank.
        billingConfig:
          $ref: '#/components/schemas/UpdateBillingConfig'
        paymentConfig:
          $ref: '#/components/schemas/UpdatePaymentConfig'
        processorConfig:
          $ref: '#/components/schemas/UpdateProcessorConfig'
        stpPaymentConfig:
          $ref: '#/components/schemas/UpdateSTPPaymentConfig'
        syncBuyerProfiles:
          type: boolean
          description: '- Valid values are True or False - If set to Y, all existing buyers associated with this template will adopt these changes. Updating existing buyers could disrupt payments in progress so before syncing profiles, ensure there will be no negative impacts to existing buyers. If set to N, changes will only be applied to future buyers created after the update Template API is sent.'
        webServicesConfig:
          $ref: '#/components/schemas/UpdateWebServicesConfig'
        boostPaymentConfig:
          $ref: '#/components/schemas/UpdateBoostPaymentConfig'
        buyerFeatureConfig:
          $ref: '#/components/schemas/UpdateBuyerFeatureConfig'
        stripePaymentConfig:
          $ref: '#/components/schemas/UpdateStripePaymentConfig'
        templateDescription:
          maxLength: 256
          type: string
          description: Supports AlphaNumeric characters. Can be updated at any time.
        paymentSecurityConfig:
          $ref: '#/components/schemas/UpdatePaymentSecurityConfig'
        approvalWorkflowConfig:
          $ref: '#/components/schemas/UpdateApprovalWorkflowConfig'
        reconciliationFileConfig:
          $ref: '#/components/schemas/UpdateReconciliationFileConfig'
        paymentNotificationConfig:
          $ref: '#/components/schemas/UpdatePaymentNotificationConfig'
        authorizationControlConfig:
          $ref: '#/components/schemas/UpdateAuthorizationControlConfig'
      description: Update Buyer Template Request
    StpPaymentConfigForGet:
      type: object
      properties:
        stpPaymentEnabled:
          type: boolean
          description: Denotes if STP payments is enabled for the buyer.  Valid values are 'True' or 'False'.
        accountHolderLastName:
          maxLength: 100
          type: string
          description: Denotes the Account Holder's last Name which will be used while processing the STP payment.
        accountHolderFirstName:
          maxLength: 100
          type: string
          description: Denotes the Account Holder's first Name which will be used while processing the STP payment.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the STP Payment Remittance notification is enabled for a buyer.  Optional field. Valid values are 'True' or 'False'. The STP supplier will be getting the payment remittance notification only if this field is enabled.
    GetRVAReconciliationFileConfig:
      type: object
      properties:
        commFileId:
          maxLength: 40
          type: string
          description: Comm file Id refers to Comm File info associated with the Request Virtua Account recon file outbound delivery.
        templateId:
          maxLength: 2
          type: string
          description: Denotes the template identifier associated with the RVA recon template to be used for generating the RVA recon file.
    GetStripePaymentConfig:
      type: object
      properties:
        stripePaymentEnabled:
          type: boolean
          description: Denotes if Stripe payments is enabled for the template (buyer).
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the Stripe Payment Remittance notification is enabled for a template (buyer).
    RvaReconciliationFileConfigForCreate-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the RVA recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company.
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the RVA recon file outbound. Required if the file level is B. The Visa implementation team provides this value after the outbound RVA recon file configuration has been completed.
        fileFormat:
          type: integer
          description: Denotes the format in which the RVA recon file needs to be generated. Needs to be numeric. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        templateId:
          maxLength: 5
          type: string
          description: Denotes the id of the recon template to be used for generating the RVA reconciliation file. The template id is returned in the response when you create a new template.  If the value for this field (the tag is not sent) is not provided, the system defaults it to the latest RVA recon standard template (currentyly 1).  Valid values are 1 - RVA Recon standard template Version 1.0
        deliveryTime:
          maxLength: 6
          type: string
          description: Denotes the delivery type or day when the RVA recon file needs to be generated and delivered. If the value for this field (the tag is not sent) is not provided, the system defaults it to'1:00' AM for the daily frequency and 1 for weekly and monthly frequency.   Valid format for the time for the daily frequency is 'HH:MM' in 24 hours format.  Valid values for the Weekly frequency  1 to 7 denoting the days.  1 being Sunday and 7 being Saturday and Monthly Frequency 1 to 31
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the RVA recon file needs to be delivered. Needs to be numeric. Valid values are 1 – Daily 2 – Weekly 3 - Monthly
        recipientLoginIds:
          maxItems: 80
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the RVA recon file in their VOL mailbox. You can setup upto 80 user ids to receive the RVA recon file.The user ids should have the VOL mailbox service entitled to them.
          items:
            type: string
    RvaReconciliationFileConfigForUpdate-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the RVA recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company. This field can be updated at any time.
        commFileId:
          type: string
          description: Denotes the Comm File ID associated with the RVA recon file outbound. The COMM file definition should exist in the system.  The Visa implementation team provides this value after the outbound RVA recon file configuration has been completed. This field can be updated at any time.
        fileFormat:
          type: integer
          description: Denotes the format in which the RVA recon file needs to be generated. Needs to be numeric. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1. This field can be updated at any time.
        templateId:
          maxLength: 5
          type: string
          description: Denotes the id of the recon template to be used for generating the RVA reconciliation file.  Valid values are 1 - RVA Recon standard template Version 1.0. This field can be updated at any time.
        deliveryTime:
          maxLength: 6
          type: string
          description: Denotes the delivery type or day when the RVA recon file needs to be generated and delivered.    Valid format for the time for the daily frequency is 'HH:MM' in 24 hours format.  Valid values for the Weekly frequency  1 to 7 denoting the days.  1 being Sunday and 7 being Saturday and Monthly Frequency 1 to 31 This field can be updated at any time.
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the RVA recon file needs to be delivered. Needs to be numeric. Valid values are 1 – Daily 2 – Weekly 3 - Monthly. This field can be updated at any time.
        recipientLoginIds:
          maxItems: 80
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the RVA recon file in their VOL mailbox. You can setup upto 80 user ids to receive the RVA recon file.The user ids should have the VOL mailbox service entitled to them. This field can be updated at any time.
          items:
            type: string
    PaymentNotificationConfigForUpdate:
      type: object
      properties:
        dateFormat:
          type: string
          description: Denotes the date format which will be used for parsing date fields in the payment files in EDI or CSV or tab format. Should be one of the VPA system supported date formats. This field can be updated at any time. Refer to <a href="/pages/B2B-virtual-account-payment-method-codes#date_formats">Date Formats</a> table.
          format: date
        defaultBuyerLanguageCode:
          maxLength: 10
          type: string
          description: Denotes the language which will be used in notifications sent to the buyer. A valid locale (language code) should be provided. For example "en_US" for US english. Refer to the <a href="/pages/B2B-virtual-account-payment-method-codes#language_codes">Language Code</a> table for langauge codes. This field can be updated at any time.
          example: en_us
        attachRemittanceDetailsFile:
          type: boolean
          description: Denotes if the remittance details file (containing the invoice details) will be attached to the payment advice notification while processig a payment.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to value set for this option for the bank. Valid values are 'True' or 'False'. This field can be set to true only if the bank attach remittance details file option is set to 'True'.  This field can be updated at any time.
        supplierReminderNotificationDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days before the payment expiration date when the system sends a reminder notification to the supplier. Optional Field.  If the value for this field (the tag is not sent) is not provided, the system defaults it to 7 days. Should be between 0 and 100. This value should be specified only when suppress supplier notification is disabled and supplier reminder notification is enabled for the buyer. This field can be updated at any time.
        supplierReminderNotificationEnabled:
          type: boolean
          description: Denotes if the system will send the payment reminder notification to the supplier (before the configured number of days (supplier reminder notification days) from the payment expiration date) to remind them to collect the payment.   If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False' if the suppress supplier notification is enabled and to 'True' if the suppress supplier notifiation is disabled.  This field can be set to true only if the bank supplier reminder notification option is set to 'True' and suppress supplier notification option for the buyer is set to false.  This field can be updated at any time.
    BErrorItem:
      type: object
      properties:
        errorCode:
          type: string
        errorDescription:
          type: string
      description: Error Item
    STPPaymentConfig:
      type: object
      properties:
        stpPaymentEnabled:
          type: boolean
          description: Denotes if the STP Payments is enabled for a template (buyer). Valid values are 'True' or 'False'. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'.  This field can be set to true only if the bank STP Payments option is set to  'True'.
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the STP Payment Remittance notification is enabled for a template (buyer). Valid values are 'True' or 'False'. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'.  This field can be set to true only if the bank STP Payment Remittance Notification option is set to 'True'. Only if this field is enabled, the STP supplier will be getting the payment remittance notification.
    Error:
      type: object
      properties:
        errorList:
          type: array
          items:
            $ref: '#/components/schemas/ErrorItem'
      description: Error object
