          $ref: '#/components/schemas/GetAuthorizationControlConfig'
        rvaReconciliationFileConfig:
          $ref: '#/components/schemas/GetRVAReconciliationFileConfig'
      description: Get Buyer Template Response V2
    StripePaymentConfigForUpdate:
      type: object
      properties:
        stripePaymentEnabled:
          type: boolean
          description: Denotes if Stripe payments is enabled for the buyer.  Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment option is set to  'True'. You can enable Stripe payments for a buyer at any time.  But you cannot disable it (update it to false) if there are Stripe suppliers present for the buyer
        remittanceNotificationEnabled:
          type: boolean
          description: Denotes if the Stripe Payment Remittance notification is enabled for a buyer.  Optional field. Valid values are 'True' or 'False'. This field can be set to true only if the bank Stripe Payment Remittance Notification option is set to 'True'. The Stripe supplier will be getting the payment remittance notification only if this field is enabled. This field can be updated at any time.
    ErrorResponse:
      type: object
      properties:
        errorObject:
          $ref: '#/components/schemas/Error'
        responseStatus:
          $ref: '#/components/schemas/Response'
      description: Create Buyer Template Error Response
    BuyerFeatureConfigForCreate:
      type: object
      properties:
        cardMaskingDigits:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in all places other than UI like the recon file, response file, etc. Should be Numeric. Should be between 4 and 12
        vcfDataFeedIndicator:
          type: string
          description: 'The vcfDataFeedIndicator is used for indicating the source of transactions/settlement data for this company. This value should be “Yes” if the FI/Processor is going to send settled transactions for the company [e.g. inbound Visa Commercial Format (VCF)]. It should be “No” if the company requires Visa to pull the settlement data over the Visa Network.  '
        pseudoAccountsEnabled:
          type: boolean
          description: Denotes if "Pseudo Accounts" (VIP Tokens) option is enabled for the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it false.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.
        fullAccountViewEnabled:
          type: boolean
          description: Denotes if "Full Account View" functionality is enabled for the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it to the bank setting for this field.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this functionality.
        cardMaskingDigitsOnline:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of digits that will be masked for the card number when displayed in the UI. Should be Numeric. Should be between 4 and 12
        onlinePaymentInstructionEnabled:
          type: boolean
          description: Denotes if Online payment instruction (Pay Now) functionality is enabled for the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   Valid Values are 'True' and 'False'.  The value can be set to true only if the bank is enabled for Online Payment Instructions.
        onlinePaymentRequisitionEnabled:
          type: boolean
          description: Denotes if Online payment Requisition functionality is enabled for the buyer.  If the value for this field (the tag is not sent) is not provided, the system defaults it to False.   Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for Online Payment Requisitions.
    BillingConfigForGet:
      type: object
      properties:
        billingBID:
          type: string
          description: The 11 digit Visa Billing BID that will be billed for the service. This is in the format of 8 digit Visa BID plus 3 digit country code. E.g. 12345678840 where 840 is country code for United States.
        billingType:
          type: string
          description: Identifies who will be billed for use of the service.  I indicates issuer will be billed (standard). T indicates Third party / fintech will be billed. M indicates manual billing is set up.
    PaymentConfigForUpdate:
      type: object
      properties:
        expirationDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Default payment expiration days which will be used if the buyer did not provide the payment expiration date either in the payment or has not configured for the supplier.  The payment expiration days will be used to calculate the payment expiration date (payment process date + the payment expiration days) which is the last day by which the supplier should collect the payment. Only numbers are allowed. This field can be updated at any time.  But the updates will affect only the future payments.
        billingCurrency:
          maxLength: 3
          pattern: ^[a-zA-Z]{3}$
          type: string
          description: Denotes the ISO alpha currency code associated with the billing Currency of the card accounts belonging to the buyer. All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. VPA system uses the billing currency as the payment currency for adjustable limit card accounts. This field can not be updated.
        allowableCurrencies:
          maxItems: 200
          uniqueItems: true
          type: array
          description: The list of currencies allowed for the buyer.  The buyer can process payments in any of these currencies.  Any payments made usin other currencies will be rejected.  All ISO alpha currency codes will be supported. For example- USD for US Dollar. It should be one of the supported active currencies in VPA. Can setup up to a max of 200 currencies. Billing currency should be present in the list else the system will automatically add it to the list. This field can be updated at any time.  But the updates will affect only the future payments.
          items:
            pattern: ^[a-zA-Z]{3}$
            type: string
        paymentAdviceOption:
          maxLength: 1
          type: string
          description: This option is used by the system decide if all payments to the same supplier should be consolidated or sent separately in the payment advice notificaion.  Valid values are 'C' for consolidated or 'S' for split. This field can be updated at any time. But the updates will affect only the future payments.
        expirationBufferDays:
          maxLength: 2
          pattern: ^[\d]+$
          type: string
          description: expirationBufferDays is the number of days after the payment expiration date by which the supplier needs to complete the collection of the payment (settlement of the card transaction should be completed). Only numbers are allowed. This field can be updated at any time.  But the updates will affect only the future payments.
        securityCodeRequired:
          type: boolean
          description: Denotes if security code is needed for the supplier to collect the payment. Optional field. Valid values are 'True' or 'False'. This field can be set to true only if the bank security code (CVV2) option is set to  'True'. This field can be updated at any time. But the updates will affect only the future payments.
    BError:
      type: object
      properties:
        errorList:
          type: array
          items:
            $ref: '#/components/schemas/BErrorItem'
      description: Error object
    BoostPaymentConfig:
      type: object
      properties:
        boostPaymentEnabled:
          type: boolean
          description: Denotes if the Boost Payments is enabled for a template (buyer). Valid values are 'True' or 'False'. Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'.  This field can be set to true only if the bank Boost Payments option is set to  'True'.
    BErrorResponse:
      type: object
      properties:
        errorObject:
          $ref: '#/components/schemas/BError'
        responseStatus:
          $ref: '#/components/schemas/BResponse'
      description: Create Buyer Template Error Response
    AuthorizationControlConfigForCreate:
      type: object
      properties:
        alertsEnabled:
          type: boolean
          description: Denotes if the system needs to send an alert when an authorization on a VPC enabled card is approved or declined.  Valid values are 'True' and 'False'. This field can be set to True only if the authControlEnabled is set to true for the buyer.
        issuerHoldingBID:
          pattern: ^[\d]{8}$
          type: string
          description: Denotes the Holding BID (business id) for the issuer.  Should be numeric. Should be set only if authControlEnabled is set to true for the buyer.
        authControlEnabled:
          type: boolean
          description: Denotes if the authorization controls needs to be enabled for the buyer.  Auth controls is mandated for VPP and VIP buyers.  If the value for this field (the tag is not sent) is not provided, the system defaults it to True if mandate auth controls is set to 'True' for the bank otherwise the system defaults it to False.
