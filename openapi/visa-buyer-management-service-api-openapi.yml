        authControlEnabled:
          type: boolean
          description: Denotes if the authorization controls needs to be enabled for the buyer.  Auth controls is mandated for VPP and VIP buyers.  You can enable auth controls for a buyer at any time.  But you cannot disable it (update it to false) if there are accounts enabled for VPC present for the buyer
