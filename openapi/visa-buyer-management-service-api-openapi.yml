                      description: 'This field accepts following values. Please use the 4-character alpha code: VIPT:VIP/Pseudo Account-Pseudo Account generated by Visa, NVPA:Non virtual account-Physical cards, MEMO:Processor account-Virtual accounts generated at the Processor, FUNA:Funding Account-Parent Account for Visa Pseudo Accounts or TSYS VPP VAN tokens, VPPT:VPP Token-TSYS generated tokens (Also referred to as TSYS VPP VANs)'
