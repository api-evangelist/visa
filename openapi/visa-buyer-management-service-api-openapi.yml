        templateName:
          maxLength: 100
          type: string
          description: Denotes the name of the recon template to be used for generating the reconciliation file.
        deliveryFrequency:
          type: integer
          description: Denotes the frequency in which the recon file needs to be delivered.  Valid values are 1 – Daily 2 – Weekly 3 - Monthly
        recipientLoginIds:
          maxItems: 50
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the recon file in their VOL mailbox.
          items:
            type: string
        adhocReconciliationReportEnabled:
          type: boolean
          description: Denotes if Adhoc Reconciliation functionality is enabled for the buyer.  Valid Values are 'True' and 'False'.
        onlinePaymentReconciliationEnabled:
          type: boolean
          description: Denotes if Online payment Reconciliation functionality is enabled for the buyers.     Valid Values are 'True' and 'False'.
    ReconciliationFileConfigForGet-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
