        visaADMOptionId:
          maxLength: 5
          type: string
          description: Denotes the option that will be used to assign the virtual account number in the TSYS VPP platform. For the TS1 platform only, the option must be set up to assign a virtual account number from the same BIN as the primary account number. This field will be populated only if it is a Visa Bank.
        settlementExpirationDays:
