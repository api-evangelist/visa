    VanConfigForUpdate:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.  Supports alphanumeric values. Required if the buyer is enabled for VANs. This field can be updated only if there are no VANs in the system associated to the buyer. This field can be set at any time but cannot be over ridden (Changed). This value will be provided by the Visa implementation team.
        vanEnabled:
          type: boolean
          description: Denotes if "VANs" (VPP Tokens) are enabled for the buyer. Valid Values are 'True' and 'False'. The value can be set to true only if the bank is enabled for this Option.  This field can be enabled (Set to True) but cannot be disabled (Set to False).This value will be provided by the Visa implementation team.
        admClientId:
          maxLength: 4
          type: string
          description: Denotes the number the TSYS VPP system uses to identify the company on the ACE Decision Max system for account assignment. This field can be set at any time but cannot be over ridden (Changed).This value will be provided by the Visa implementation team.
        mcADMOptionId:
          maxLength: 5
          type: string
          description: Denotes the option that will be used to assign the virtual account number in the TSYS VPP platform. For the TS1 platform only, the option must be set up to assign a virtual account number from the same BIN as the primary account number. If it is a mastercard bank, then this field is required.  This value will be provided by the Visa implementation team. This field can be set at any time but cannot be over ridden (Changed).
        processingType:
          maxLength: 4
          type: string
          description: Denotes the Processing type for the virtual account number (VAN). This field can be set at any time but cannot be over ridden (Changed). This value will be provided by the Visa implementation team.
        visaADMOptionId:
          maxLength: 5
          type: string
          description: Denotes the option that will be used to assign the virtual account number in the TSYS VPP platform. For the TS1 platform only, the option must be set up to assign a virtual account number from the same BIN as the primary account number. If it is a Visa bank, then this field is required.  This field can be set at any time but cannot be over ridden (Changed). This value will be provided by the Visa implementation team.
    ResponseFileConfigForCreate-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the response COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B and C.
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the Response file outbound. Required if the file level is B. The Visa implementation team provides this value after the outbound response file configuration has been completed.
        fileFormat:
          type: integer
          description: Denotes the format in which the response file needs to be generated. Needs to be numeric. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        recipientLoginIds:
          maxItems: 80
          uniqueItems: true
          type: array
          description: Contains the list of user ids of bank/buyer users who will be receiving the response file in their VOL mailbox.  You can setup upto 80 user ids to receive the response file. The user ids should have the VOL mailbox service entitled to them.
          items:
            type: string
    ReconciliationFileConfigForGet:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the recon COMM File configuration is defined to be delivered to the bank(B) or Company (C).  Valid values are B - Bank and C - Company.
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the recon file outbound.
        fileFormat:
          type: integer
          description: Denotes the format in which the recon file needs to be generated.   Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        deliveryTime:
