          type: string
          description: Denotes the Holding BID (business id) for the issuer.  Should be numeric. Should be set only if authControlEnabled is set to true for the template.
        authControlEnabled:
          type: boolean
          description: Denotes if the authorization controls needs to be enabled for the template (in turn the buyer).  Auth controls is mandated for VPP and VIP buyers.  If the value for this field (the tag is not sent) is not provided, the system defaults it to True if mandate auth controls is set to 'True' for the bank otherwise the system defaults it to False.
    VanConfigForGet:
      type: object
      properties:
        fcsBankId:
          maxLength: 4
          type: string
          description: Denotes the Bank Identifier in the TSYS VPP FCS system.  If the value for this field (the tag is not sent) is not provided, the system defaults it to the bank FCS ID if there is only one setup at the bank level. Supports alphanumeric values. Required if the buyer is enabled for VANs.
        vanEnabled:
