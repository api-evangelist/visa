                  type: object
                  properties:
                    subscribed:
                      type: boolean
                      description: 'This field indicates if the accountType should be subscribed to the specified Data API(s).  E.g. if you want to subscribe the account type to the API provide ''true'' here.  To unsubscribe an account type to an API, provide ''false''. Valid Values are ''True'' and ''False''.The valid value must be provided for the account type.  '
