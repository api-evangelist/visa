        bucketedProxyEnabled:
          type: boolean
          description: Denotes if bucketed proxy is enabled for proxies associated with the template (buyers). Valid Values are 'True' and 'False'. If the value for this field (the tag is not sent) is not provided, the system defaults it to False.    The value can be set to true only if the bank is enabled for bucketed proxy. This field Can be edited at any time.
    AuthorizationControlConfigForUpdate:
      type: object
      properties:
        alertsEnabled:
          type: boolean
          description: Denotes if the system needs to send an alert when an authorization on a VPC enabled card is approved or declined.  Valid values are 'True' and 'False'. This field can be set to True only if the authControlEnabled is set to true for the buyer. The alerts will be sent to the buyer contact's email address.  This field can be updated at any time.
        issuerHoldingBID:
          pattern: ^[\d]{8}$
