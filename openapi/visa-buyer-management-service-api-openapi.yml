          items:
            type: string
        adhocReconciliationReportEnabled:
          type: boolean
          description: Denotes if Adhoc Reconciliation functionality is enabled for the buyer.  Valid Values are 'True' and 'False'.
        onlinePaymentReconciliationEnabled:
          type: boolean
          description: Denotes if Online payment Reconciliation functionality is enabled for the buyers.     Valid Values are 'True' and 'False'.
    ResponseFileConfigForGet-1:
      type: object
      properties:
        fileLevel:
          maxLength: 1
          type: string
          description: Denotes if the response COMM File configuration is defined to be delivered to the bank(B) or Company (C).
        commFileId:
          maxLength: 40
          type: string
          description: Denotes the Comm File ID associated with the Response file outbound. The Visa implementation team provides this value after the outbound response file configuration has been completed.
        fileFormat:
          type: integer
          description: Denotes the format in which the response file needs to be generated. Valid values are 1 – XLS V0, 2 – CSV V0, 3 -  XLS V1, 4 – CSV V1
        recipientLoginIds:
