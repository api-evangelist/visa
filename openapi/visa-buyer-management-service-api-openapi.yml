    GetContactInfo:
      type: object
      properties:
        phone1:
          maxLength: 20
          type: string
          description: Buyer contact phone number. Will be alphanumeric.
        emailAddress:
          maxLength: 100
          type: string
          description: Denotes the buyer's contact Email Address.  Will be a valid email address.
        implementationType:
          type: integer
          description: Valid Values are:1 – VPA UI, 2 – VPA API and 3 – Visa Commercial Pay.  1 denotes buyer uses VPA UI (issuer direct use of VPA).  2 denotes buyer uses a third party fintech's user interface and third party is using VPA APIs.  3 denotes buyer uses Visa Commercial Pay service.
    PaymentSecurityConfigForCreate:
      type: object
      properties:
        customSecurityQuestions:
          maxItems: 3
          uniqueItems: true
          type: array
          description: The questions (text) which will be used at random (Only one of the questions will be displayed) to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. The system sends the security questions and answers to the supplier when the supplier is setup for the buyer.  At least one question needs to be sent if custom security question is enabled for the buyer.
          items:
            maxLength: 100
            type: string
        defaultSecurityQuestion:
          maxLength: 256
          type: string
          description: Denotes the text for the default security question which will be displayed to the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  If the value for this field (the tag is not sent) is not provided, the system defaults it to "Credential Text".
        defaultSecurityFieldCode:
          maxLength: 1
          type: string
          description: Denotes the field system uses to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details. Valid values are '1' - Postal code and '2' - Supplier ID. If the value for this field (the tag is not sent) is not provided, the system defaults it to '1'. The default security is used only when the system creates new suppliers while processing payment files (EDI 820) or if custom security question is not enabled.
        customSecurityQuestionsEnabled:
          type: boolean
          description: Denotes if the buyer wants to use custom security questions to authenticate the supplier when they click on the URL sent in the payment advice notification for viewing the full card details.  Valid values are 'True' and 'False'. Optional field. This field can be set to True only if the bank custom security questions option is set to True.
    ContactInfo:
      type: object
      properties:
        phone1:
          maxLength: 20
          type: string
          description: Buyer contact phone number. Should be alphanumeric. Special characters allowed are - (dash), ( (Open braces),) (close braces).
        emailAddress:
          maxLength: 100
          type: string
          description: Denotes the buyer's contact Email Address.  Should be an valid email address.
        implementationType:
          type: integer
          description: Valid Values are:1 – VPA UI, 2 – VPA API and 3 – Visa Commercial Pay.1 denotes buyer uses VPA UI (issuer direct use of VPA).  2 denotes buyer uses a third party fintech's user interface and third party is using VPA APIs. 3 denotes buyer uses Visa Commercial Pay service.
    BoostPaymentConfigForCreate:
      type: object
      properties:
        boostPaymentEnabled:
          type: boolean
          description: Denotes if Boost payments is enabled for the buyer.  Optional field. If the value for this field (the tag is not sent) is not provided, the system defaults it to 'False'. Valid values are 'True' or 'False'. This field can be set to true only if the bank Boost Payment option is set to  'True'.
    RVAReconciliationFileConfig:
