    UpdateProxyConfig:
      type: object
      properties:
        holdDays:
          maxLength: 3
          pattern: ^[\d]+$
          type: string
          description: Denotes the number of days an account picked up for a payment in a proxy will be kept on hold before being used for another payment.  For payments, the hold days start from the day the payment was processed and for Request Virtual Account, the hold days start from the day the end date of the RVA has reached. Should be a numeric value between 1 to 999. If the value for this field (the tag is not sent) is not provided, the system defaults it to 90 days.  This field Can be edited at any time.
