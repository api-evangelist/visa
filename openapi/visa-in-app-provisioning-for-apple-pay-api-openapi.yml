        vCardID: v-123-b25dd0af-2960-420b-8aaa-49b3e466c00f
        deviceCert: 
        nonceSignature: QHuLYArUCO2OZevP0rHc99g9RJp4O1dgsZuVpUdlA7zPWqCDhVQo9Mxr1uPS6GVyjZYo3YElIhHRV4Mv3wEJ3hGOaxK1gResup88QWDK1fL0
