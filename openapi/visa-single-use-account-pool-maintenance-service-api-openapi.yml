  /vpa/v1/proxy/CreateProxyPool:
    post:
      tags:
      - Single Use Account Pool Maintenance Service
      summary: Create Proxy Pool
      description: The Create operation allows the consumer to create a new proxy pool for a buyer.
      operationId: Create Proxy Pool
      requestBody:
        content:
          application/json:
            schema:
              required:
              - buyerId
              - clientId
              - messageId
              - proxyAccountNumber
              type: object
              properties:
                buyerId:
                  maxLength: 25
                  type: string
                  description: Denotes the buyer identifier as defined in Visa Payables Automation. This will be provided by the Visa implementation team. Should be alphanumeric. No special characters except _ (Underscore) and  (Dash) are allowed. Should be an existing buyer ID in the system and associated to the bank (associated to the client ID).
                clientId:
                  maxLength: 25
                  type: string
                  description: Denotes the client ID associated with the bank for which the proxy is being setup. Should be alphanumeric and should exist in the system. Visa will provide this during implementation.
                messageId:
                  maxLength: 36
                  type: string
                  description: Unique identifier for identifying the request. Each request sent to VPA requires its own unique ID.
                creditLimit:
                  maxLength: 14
                  type: string
                  description: Denotes the credit limit associated with the proxy pool. All accounts in the proxy pool will have the same credit limit. Required only if the bank and buyer are enabled for bucketed proxy. Should be an integer numeric value. Applicable only for regular processor PANs.
                reOrderCount:
                  maxLength: 9
                  type: string
                  description: Denotes the total number of accounts to be reordered when the proxy pool has reached the Minimum Available Account. This field is used only when the auto replenishment of the proxy pool is enabled for the buyer. Should be an integer numeric value. Required only if auto replenishment has been enabled for the buyer.
                proxyPoolType:
                  maxLength: 1
                  type: string
                  description: 'Indicates if the Proxy pool is a multi use pool (meaning the accounts are recycled) or a one time use pool (meaning the accounts are used once and deleted). Valid values are: (1) Multi Use Pool (2) One Time Use Pool. If not provided, the system defaults to 1.'
                  enum:
                  - '1'
                  - '2'
                proxyAccountType:
                  maxLength: 1
                  type: string
                  description: 'Denotes the account type. Valid values are: (1) SUA adjustable (2) SUA. If not provided, the system defaults to 2 for VIP/VIPP accounts.'
                  enum:
                  - '1'
                  - '2'
                initialOrderCount:
                  maxLength: 9
                  type: string
                  description: Denotes the total number of accounts which needs to be ordered at the time of setting up the proxy pool. This field is used only when the auto replenishment of the proxy pool is enabled for the buyer. Should be an integer numeric value. Required only if auto replenishment has been enabled for the buyer.
                authControlEnabled:
                  type: boolean
                  description: Denotes if the auth control (VPC) is enabled for the proxy pool or not. Should be set to True if the bank is mandated for auth controls. Must be set to True for VIP and VPP account pools.
                proxyAccountNumber:
                  maxLength: 19
                  type: string
                  description: Denotes the proxy pool account number. Should be alphanumeric. Should be an existing proxy pool number for the buyer. No special characters except _ (Underscore) and  (Dash) are allowed. If not provided, system will return details of all proxies (up to 250 proxies) associated with the buyer.
                fundingAccountNumber:
                  type: string
                  description: Denotes the funding account number which will be used for generating the VIP or VPP accounts. The full 16 digits needs to be passed for the VIP and VPP proxy pools. If not provided, the system will use the default funding account.
                minAvailableAccounts:
                  maxLength: 9
                  type: string
                  description: Denotes the minimum number of accounts that should be available in the proxy pool at any given time. System reorders accounts when the number of available accounts in the Ready to Use status in the proxy pool is less than the value of this field E.g. if set to 10,000, then accounts will be reordered when the number of available accounts in the proxy pool is less than 10,000. Required only if auto replenishment has been enabled for the buyer.
            examples:
              Default:
                summary: Default
                value:
                  authControlEnabled: true
                  clientId: B2BWS_1_1_9999
                  proxyAccountType: '2'
                  reOrderCount: '2'
                  minAvailableAccounts: '3'
                  proxyAccountNumber: TestProxyPool
                  proxyPoolType: '1'
                  messageId: '2020-03-01T03:47:20.000Z'
                  buyerId: '9999'
                  fundingAccountNumber: '4111111111111111'
                  initialOrderCount: '5'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  CreateProxyPoolResponse:
                    required:
                    - messageId
                    - statusCode
                    - statusDesc
                    type: object
                    properties:
                      errors:
                        type: array
                        description: Errors List
                        items:
                          type: object
                          properties:
                            Error:
                              required:
                              - code
                              - statusDesc
                              type: object
                              properties:
                                code:
                                  type: string
                                  description: error code
                                statusDesc:
                                  type: string
                                  description: error description
                      messageId:
                        maxLength: 36
                        type: string
                        description: Unique ID which was sent in the request.
                      statusCode:
                        type: string
                        description: Status code of the response.
                      statusDesc:
                        type: string
                        description: Status description of the response. List of status codes and descriptions can be found in the following link.
                    description: Success
              examples:
                Default:
                  summary: Default
                  value:
                    statusDesc: Proxy Pool account created successfully
                    proxyAccountNumber: '1234567898'
                    messageId: '1536776321'
                    statusCode: CP000
        '400':
          description: Refer to the <a href="/pages/B2B-virtual-account-payment-method-error-codes#create_proxy_pool">Error Codes</a> page for the list of error codes for this API.
          content: {}
